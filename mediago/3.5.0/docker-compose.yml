networks:
  1panel-network:
    external: true
services:
  mediago:
    container_name: ${CONTAINER_NAME}
    # 以指定 UID/GID 运行（宿主机挂载目录需 chown 到同一属主，否则容器内无法写入）
    user: "${UID}:${GID}"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    command: --local-dir=${LOCAL_DIR:-/app/mediago/downloads}
    environment:
      - LOCAL_DIR=${LOCAL_DIR}
    image: caorushizi/mediago:3.5.0
    labels:
      createdBy: Apps
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8899
    restart: always
    volumes:
      - ./data:/app/mediago
