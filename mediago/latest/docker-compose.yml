networks:
  1panel-network:
    external: true
services:
  mediago:
    container_name: ${CONTAINER_NAME}
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    image: caorushizi/mediago:3.5.0
    labels:
      createdBy: Apps
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8899
    restart: always
    volumes:
      - ./data:/app/mediago
