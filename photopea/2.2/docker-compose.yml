services:
  photopea:
    container_name: ${CONTAINER_NAME}
    # 以指定 UID/GID 运行（宿主机挂载目录需 chown 到同一属主，否则容器内无法写入）
    user: "${UID}:${GID}"
    image: ${IMAGE}
    restart: always
    networks:
      - 1panel-network
    ports:
      - ${PANEL_APP_PORT_HTTP}:8887
    labels:
      createdBy: "Apps"

networks:
  1panel-network:
    external: true
