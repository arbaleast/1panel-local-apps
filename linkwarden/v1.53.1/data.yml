      type: text
    - default: "3000"
      edit: true
      envKey: SERVER_PORT
      labelEn: Server Port (Container)
      labelZh: 容器内服务端口
      label:
        en: Server Port (Container)
        zh: 容器内服务端口
        zh-Hant: 容器內服務埠
        ja: サーバーポート（コンテナ内）
        ko: 서버 포트 (컨테이너 내)
        ru: Порт сервера (контейнер)
        ms: Port pelayan (bekas)
        pt-br: Porta do servidor (contêiner)
      required: false
      type: text
      hidden: true
    - default: Asia/Shanghai
      edit: true
      envKey: TZ
      labelEn: Timezone
      labelZh: 时区
      label:
        en: Timezone
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ru: Часовой пояс
        ms: Zon waktu
        pt-br: Fuso horário
      required: true
      type: text
    - default: "2"
