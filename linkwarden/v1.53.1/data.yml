    - default: 0.0.0.0
      edit: true
      envKey: HOST_IP
      labelEn: Bind IP (use 0.0.0.0 for reverse proxy)
      labelZh: 绑定 IP (反向代理场景用 0.0.0.0)
      label:
        en: Bind IP (use 0.0.0.0 for reverse proxy)
        zh: 绑定 IP (反向代理场景用 0.0.0.0)
        zh-Hant: 綁定 IP (反向代理場景用 0.0.0.0)
        ja: バインド IP (リバースプロキシは 0.0.0.0)
