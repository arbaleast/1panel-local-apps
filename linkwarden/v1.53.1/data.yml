name: linkwarden
title: Linkwarden 自托管书签管理器
description:
  zh: 开源自托管书签管理器，支持标签、全文搜索、网页归档与浏览器扩展。
  en: Open-source self-hosted bookmark manager with tags, full-text search, web archiving and browser extensions.
additionalProperties:
  key: linkwarden
  name: linkwarden
  tags:
    - bookmark
    - tool
  shortDescZh: Linkwarden 自托管书签管理器
  shortDescEn: Linkwarden self-hosted bookmark manager
  description:
    zh: 开源自托管书签管理器，支持标签、全文搜索、网页归档与浏览器扩展。
    en: Open-source self-hosted bookmark manager with tags, full-text search, web archiving and browser extensions.
    zh-Hant: 開源自託管書籤管理器，支援標籤、全文搜尋、網頁歸檔與瀏覽器擴充套件。
    ja: タグ・全文検索・ウェブアーカイブ・ブラウザ拡張機能付きのオープンソースのセルフホスト型ブックマークマネージャー。
    ko: 태그, 전문 검색, 웹 아카이빙 및 브라우저 확장을 지원하는 오픈소스 자체 호스팅 북마크 관리자.
    ru: Самохостируемый менеджер закладок с открытым исходным кодом, поддерживающий теги, полнотекстовый поиск, веб-архивирование и расширения браузера.
    ms: Pengurus penanda buku sumber terbuka yang dihoskan sendiri dengan tag, carian teks penuh, pengarkiban web dan sambungan pelayar.
    pt-br: Gerenciador de marcadores auto-hospedado de código aberto com tags, busca de texto completo, arquivamento da web e extensões de navegador.
  type: tool
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://linkwarden.app
  github: https://github.com/linkwarden/linkwarden
  document: https://docs.linkwarden.app/self-hosting/installation
  formFields:
    - default: "3000"
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: Web Port
      labelZh: Web 端口
      label:
        en: Web Port
        zh: Web 端口
        zh-Hant: Web 埠
        ja: Web ポート
        ko: Web 포트
        ru: Web порт
        ms: Port Web
        pt-br: Porta Web
      required: true
      rule: paramPort
      type: number
    - default: ""
      edit: true
      envKey: POSTGRES_PASSWORD
      labelEn: Postgres password (required)
      labelZh: Postgres 密码（必填）
      label:
        en: Postgres password (required)
        zh: Postgres 密码（必填）
        zh-Hant: Postgres 密碼（必填）
        ja: Postgres パスワード（必須）
        ko: Postgres 비밀번호 (필수)
        ru: Пароль Postgres (обязательно)
        ms: Kata laluan Postgres (wajib)
        pt-br: Senha Postgres (obrigatório)
      required: true
      type: password
    - default: ""
      edit: true
      envKey: MEILI_MASTER_KEY
      labelEn: Meilisearch master key (required, generate via `openssl rand -hex 32`)
      labelZh: Meilisearch 主密钥（必填，`openssl rand -hex 32` 生成）
      label:
        en: Meilisearch master key (required)
        zh: Meilisearch 主密钥（必填）
        zh-Hant: Meilisearch 主密鑰（必填）
        ja: Meilisearch マスターキー（必須）
        ko: Meilisearch 마스터 키 (필수)
        ru: Мастер-ключ Meilisearch (обязательно)
        ms: Kunci induk Meilisearch (wajib)
        pt-br: Chave mestra do Meilisearch (obrigatório)
      required: true
      type: password
    - default: ""
      edit: true
      envKey: NEXTAUTH_SECRET
      labelEn: NextAuth secret (required, generate via `openssl rand -base64 32`)
      labelZh: NextAuth 密钥（必填，`openssl rand -base64 32` 生成）
      label:
        en: NextAuth secret (required)
        zh: NextAuth 密钥（必填）
        zh-Hant: NextAuth 密鑰（必填）
        ja: NextAuth シークレット（必須）
        ko: NextAuth 시크릿 (필수)
        ru: Секрет NextAuth (обязательно)
        ms: Rahsia NextAuth (wajib)
