      labelZh: NextAuth 地址（如 https://link.example.com 或 http://192.168.1.10:3000）
      label:
        en: NextAuth URL
        zh: NextAuth 地址
        zh-Hant: NextAuth 位址
        ja: NextAuth URL
        ko: NextAuth URL
        ru: URL NextAuth
        ms: URL NextAuth
        pt-br: URL NextAuth
