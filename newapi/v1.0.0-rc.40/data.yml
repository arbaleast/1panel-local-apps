additionalProperties:
  key: newapi
  name: newapi v1.0.0-rc.40
  tags:
    - AI
    - LLM
    - Gateway
  shortDescZh: AI/LLM API 聚合网关（兼容 OpenAI / Claude / Gemini 等多上游）
  shortDescEn: Aggregated AI/LLM API gateway compatible with OpenAI / Claude / Gemini
  description:
    zh: New API 是 QuantumNous 团队维护的 AI 大模型 API 聚合与分发平台，兼容 OpenAI / Anthropic / Gemini / Azure / AWS Bedrock 等多上游协议，支持渠道负载均衡、用户额度、配额管理、计费、兑换码、绘图、音频转写、任务插件等功能。需要外接 MySQL/MariaDB 与 Redis（默认配置指向 1Panel 内置 mariadb + redis 应用），提供 Web 面板（默认 3000 端口）与 REST API，可作为多上游 AI 服务的统一入口。
    en: New API is an aggregated AI/LLM API gateway by QuantumNous, compatible with OpenAI, Anthropic, Gemini, Azure, AWS Bedrock and many other upstream protocols. Provides channel load balancing, user quota, billing, redemption codes, image generation, audio transcription, task plugins and more. Requires external MySQL/MariaDB and Redis (defaults target the bundled 1Panel mariadb + redis apps). Exposes a Web panel (default port 3000) and REST API as a unified entry point for multi-upstream AI services.
    zh-Hant: New API 是 QuantumNous 團隊維護的 AI 大模型 API 聚合與分發平台，兼容 OpenAI / Anthropic / Gemini / Azure / AWS Bedrock 等多上游協議，支援渠道負載平衡、用戶額度、配額管理、計費、兌換碼、繪圖、音訊轉寫、工作流外掛等功能。需外接 MySQL/MariaDB 與 Redis（預設配置指向 1Panel 內建 mariadb + redis 應用），提供 Web 面板（預設 3000 連接埠）與 REST API，可作為多上游 AI 服務的統一入口。
    ja: New API は QuantumNous チームが维护する AI 大規模モデル API 集約・配信プラットフォーム。OpenAI / Anthropic / Gemini / Azure / AWS Bedrock など複数上游プロトコルに互換。チャネル負荷分散、ユーザー枠、クォータ管理、課金、引き換えコード、画像生成、音声文字起こし、タスクプラグインなどをサポート。外部 MySQL/MariaDB と Redis が必要（デフォルトは 1Panel 内蔵 mariadb + redis アプリ）。Web パネル（デフォルト 3000 ポート）と REST API を提供。
    ko: New API는 QuantumNous 팀이 유지하는 AI 대규모 모델 API 집계·유통 플랫폼으로, OpenAI / Anthropic / Gemini / Azure / AWS Bedrock 등 다양한 업스트림 프로토콜과 호환됩니다. 채널 로드 밸런싱, 사용자 할당량, 청구, 교환 코드, 이미지 생성, 오디오 전사, 작업 플러그인 등을 지원합니다. 외부 MySQL/MariaDB 및 Redis 필요(기본값은 1Panel 내장 mariadb + redis 앱). Web 패널(기본 3000 포트)과 REST API 제공.
    ru: New API — агрегирующая платформа AI/LLM API от QuantumNous, совместимая с OpenAI, Anthropic, Gemini, Azure, AWS Bedrock и другими протоколами. Поддержка балансировки каналов, квот пользователей, биллинга, кодов активации, генерации изображений, транскрибации аудио, плагинов задач. Требует внешние MySQL/MariaDB и Redis (по умолчанию указывает на встроенные в 1Panel приложения mariadb + redis). Веб-панель (порт 3000 по умолчанию) и REST API.
    ms: New API ialah platform pengagregatan dan pengagihan API model AI besar oleh QuantumNous, serasi dengan protokol OpenAI / Anthropic / Gemini / Azure / AWS Bedrock dan lain-lain. Menyokong pengimbangan beban saluran, kuota pengguna, pengebilan, kod tebusan, penjanaan imej, transkripsi audio, pemalam tugas. Memerlukan MySQL/MariaDB dan Redis luaran (lalai menunjuk aplikasi 1Panel terbina dalam mariadb + redis). Panel Web (lalai port 3000) dan REST API.
    pt-br: New API é uma plataforma de agregação e distribuição de APIs de IA/LLM mantida pela QuantumNous, compatível com OpenAI, Anthropic, Gemini, Azure, AWS Bedrock e outros protocolos upstream. Suporta balanceamento de canais, cotas de usuários, cobrança, códigos de resgate, geração de imagens, transcrição de áudio, plugins de tarefas. Requer MySQL/MariaDB e Redis externos (padrão aponta para os apps mariadb + redis embutidos no 1Panel). Painel Web (porta 3000 padrão) e REST API.
  type: tool
  architectures:
    - amd64
    - arm64
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://github.com/QuantumNous/new-api
  github: https://github.com/QuantumNous/new-api
  formFields:
    # ---- 镜像源（calciumion/new-api，DockerHub multi-arch manifest）----
    - default: calciumion/new-api
      edit: true
      envKey: IMAGE
      labelEn: Image
      labelZh: 镜像
      label:
        en: Image
        zh: 镜像
        zh-Hant: 映像
        ja: イメージ
        ko: 이미지
        ru: Образ
        ms: Imej
        pt-br: Imagem
      required: true
      rule: paramImageTag
      type: text
    # ---- 镜像版本：上游目前仅发布 v1.0.0-rc.X 预发布，detect 跟踪该序列 ----
    - default: v1.0.0-rc.40
      edit: true
      envKey: APP_VERSION
      labelEn: App Version
      labelZh: 应用版本
      label:
        en: App Version
        zh: 应用版本
        zh-Hant: 應用版本
        ja: アプリバージョン
        ko: 앱 버전
        ru: Версия приложения
        ms: Versi Aplikasi
        pt-br: Versão do aplicativo
      required: true
      rule: paramImageTag
      type: text
    # ---- Web 面板 HTTP 端口（容器内 new-api 固定监听 3000）----
    - default: 3000
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 連接埠
        ja: HTTP ポート
        ko: HTTP 포트
        ru: HTTP-порт
        ms: Port HTTP
        pt-br: Porta HTTP
      required: true
      rule: paramPort
      type: number
    # ---- 时区 ----
    - default: Asia/Shanghai
      edit: true
      envKey: TZ
      labelEn: Timezone
      labelZh: 时区
      label:
        en: Timezone
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ru: Часовой пояс
        ms: Zon waktu
        pt-br: Fuso horário
      required: true
      type: text
    # ============================================================
    # 外部 MySQL/MariaDB 连接（dendrite 复盘：完整 DSN 必拆分，paramCommon
    # 正则 /^[a-zA-Z0-9]{1}[a-zA-Z0-9._-]{1,63}$/ 拒掉 : @ / 等字符）
    # 上游 DSN 格式（Go MySQL driver）：<user>:<pass>@tcp(<host>:<port>)/<db>
    # 默认指向 1Panel 内置 mariadb 应用：容器名 1Panel-mariadb-XXXX (Base32 4 字符)
    # ============================================================
    - default: 1Panel-mariadb-SHvg
      edit: true
      envKey: DB_HOST
      labelEn: MariaDB Host
      labelZh: MariaDB 主机
      label:
        en: MariaDB Host
        zh: MariaDB 主机
        zh-Hant: MariaDB 主機
        ja: MariaDB ホスト
        ko: MariaDB 호스트
        ru: Хост MariaDB
        ms: Hos MariaDB
        pt-br: Host MariaDB
      required: true
      rule: paramCommon
      type: text
    - default: 3306
      edit: true
      envKey: DB_PORT
      labelEn: MariaDB Port
      labelZh: MariaDB 端口
      label:
        en: MariaDB Port
        zh: MariaDB 端口
        zh-Hant: MariaDB 連接埠
        ja: MariaDB ポート
        ko: MariaDB 포트
        ru: Порт MariaDB
        ms: Port MariaDB
        pt-br: Porta MariaDB
      required: true
      rule: paramPort
      type: number
    - default: root
      edit: true
      envKey: DB_USER
      labelEn: DB User
      labelZh: DB 用户名
      label:
        en: DB User
        zh: DB 用户名
        zh-Hant: DB 使用者名稱
        ja: DB ユーザー名
        ko: DB 사용자
        ru: Пользователь БД
        ms: Pengguna DB
        pt-br: Usuário DB
      required: true
      rule: paramCommon
      type: text
    - default: 1panel123
      edit: true
      envKey: DB_PASSWORD
      labelEn: DB Password
      labelZh: DB 密码
      label:
        en: DB Password
        zh: DB 密码
        zh-Hant: DB 密碼
        ja: DB パスワード
        ko: DB 비밀번호
        ru: Пароль БД
        ms: Kata laluan DB
        pt-br: Senha DB
      required: true
      rule: paramComplexity
      type: password
    # ---- DB 名：new-api 会自动建表，建议手动 pre-create 一个空库并赋权 ----
    - default: newapi
      edit: true
      envKey: DB_NAME
      labelEn: DB Name
      labelZh: DB 库名
      label:
        en: DB Name
        zh: DB 库名
        zh-Hant: DB 資料庫名稱
        ja: DB 名前
        ko: DB 이름
        ru: Имя БД
        ms: Nama DB
        pt-br: Nome do BD
      required: true
      rule: paramCommon
      type: text
    # ============================================================
    # 外部 Redis 连接（同 dendrite 拆分方案，REDIS_CONN_STRING 含 : @ / 必拆）
    # Redis URL 格式：redis://:<password>@<host>:<port>
    # 默认指向 1Panel 内置 redis 应用：容器名 1Panel-redis-XXXX (Base32 4 字符)
    # ============================================================
    - default: 1Panel-redis-wd53
      edit: true
      envKey: REDIS_HOST
      labelEn: Redis Host
      labelZh: Redis 主机
      label:
        en: Redis Host
        zh: Redis 主机
        zh-Hant: Redis 主機
        ja: Redis ホスト
        ko: Redis 호스트
        ru: Хост Redis
        ms: Hos Redis
        pt-br: Host Redis
      required: true
      rule: paramCommon
      type: text
    - default: 6379
      edit: true
      envKey: REDIS_PORT
      labelEn: Redis Port
      labelZh: Redis 端口
      label:
        en: Redis Port
        zh: Redis 端口
        zh-Hant: Redis 連接埠
        ja: Redis ポート
        ko: Redis 포트
        ru: Порт Redis
        ms: Port Redis
        pt-br: Porta Redis
      required: true
      rule: paramPort
      type: number
    - default: 1panel123
      edit: true
      envKey: REDIS_PASSWORD
      labelEn: Redis Password
      labelZh: Redis 密码
      label:
        en: Redis Password
        zh: Redis 密码
        zh-Hant: Redis 密碼
        ja: Redis パスワード
        ko: Redis 비밀번호
        ru: Пароль Redis
        ms: Kata laluan Redis
        pt-br: Senha Redis
      required: true
      rule: paramComplexity
      type: password
    # ---- 节点名（多节点部署时区分节点；单节点可保留默认）----
    - default: newapi-node-1
      edit: true
      envKey: NODE_NAME
      labelEn: Node Name
      labelZh: 节点名
      label:
        en: Node Name
        zh: 节点名
        zh-Hant: 節點名稱
        ja: ノード名
        ko: 노드 이름
        ru: Имя узла
        ms: Nama nod
        pt-br: Nome do nó
      required: true
      rule: paramCommon
      type: text
    # ---- Session 密钥（多机部署必须修改；单节点可保留默认）----
    - default: please-change-this-secret-in-production
      edit: true
      envKey: SESSION_SECRET
      labelEn: Session Secret
      labelZh: Session 密钥
      label:
        en: Session Secret
        zh: Session 密钥
        zh-Hant: Session 金鑰
        ja: Session 秘密鍵
        ko: Session 비밀키
        ru: Session-секрет
        ms: Kunci Session
        pt-br: Chave de Sessão
      required: true
      rule: paramCommon
      type: text
    # ---- 错误日志开关 ----
    - default: "true"
      edit: true
      envKey: ERROR_LOG_ENABLED
      labelEn: Error Log
      labelZh: 错误日志
      label:
        en: Error Log
        zh: 错误日志
        zh-Hant: 錯誤日誌
        ja: エラーログ
        ko: 오류 로그
        ru: Журнал ошибок
        ms: Log Ralat
        pt-br: Log de Erros
      required: true
      rule: paramSelect
      type: select
      values:
        - label: 启用
          value: "true"
        - label: 禁用
          value: "false"
    # ---- 批量更新开关 ----
    - default: "true"
      edit: true
      envKey: BATCH_UPDATE_ENABLED
      labelEn: Batch Update
      labelZh: 批量更新
      label:
        en: Batch Update
        zh: 批量更新
        zh-Hant: 批次更新
        ja: バッチ更新
        ko: 배치 업데이트
        ru: Пакетное обновление
        ms: Kemas kini kelompok
        pt-br: Atualização em lote
      required: true
      rule: paramSelect
      type: select
      values:
        - label: 启用
          value: "true"
        - label: 禁用
          value: "false"