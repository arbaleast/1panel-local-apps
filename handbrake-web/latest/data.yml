additionalProperties:
  key: handbrake-web
  name: HandBrake Web latest
  type: tool
  description:
    en: "Dual-service deploy: handbrake-server (coordinator + Web UI) + handbrake-worker (HandBrakeCLI + NVENC). Image ghcr.io/thenickoftime/handbrake-web-{server,worker}:latest, upstream publishes only `latest` tag. ⚠️ P620 NVENC not officially validated."
    zh: "双 service 部署: handbrake-server (协调+Web UI) + handbrake-worker (HandBrakeCLI + NVENC). 镜像 ghcr.io/thenickoftime/handbrake-web-{server,worker}:latest, upstream 仅发布 latest tag. ⚠️ P620 NVENC 未官方验证."
  formFields:
    # 1Panel 自动提供变量 (无需声明): CONTAINER_NAME, HOST_IP, CPUS, MEMORY_LIMIT
    # 字段选择: 跟随官方 setup guide (https://github.com/TheNickOfTime/handbrake-web/wiki/Setup-Guide)
    #   user: 1000:1000 (compose 硬码, 跟随官方)
    #   ports: 9999:9999 (compose 硬码 + PANEL_APP_PORT_HTTP 暴露)
    #   volumes: /data (server only) + /video (server + worker 共享, MEDIA_PATH formField)
    #   environment: WORKER_ID + SERVER_URL (formField 暴露) + SERVER_PORT (硬码 9999)
    # 删除的 formField: NVIDIA_ENABLE / NVIDIA_VISIBLE_DEVICES / NVIDIA_DRIVER_CAPABILITIES
    #   官方 setup guide 与 compose.nvidia.yaml 都未声明, 属于 dead code
    #   NVIDIA 设备注入完全靠 compose 的 deploy.resources.reservations.devices 块
    # rule 策略: 跟 handbrake/1.11.2-ls41 TIME_ZONE 模式对齐 (无 rule), 避免 1Panel UI 弹
    #   '支持英文、数字、.-和_，长度 2-64' 误导用户以为 hostname 有限制
    # AGENTS.md "formField 不渲染 help/placeholder" 规约: 详细说明放 README.md

    - envKey: PANEL_APP_PORT_HTTP
      type: number
      default: 9999
      required: true
      rule: paramPort
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 端口
        ja: HTTP ポート
        ko: HTTP 포트
        ru: HTTP-порт
        ms: Port HTTP
        pt-br: Porta HTTP

    - envKey: TIME_ZONE
      type: text
      default: Asia/Shanghai
      required: true
      edit: true
      label:
        en: Timezone
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ru: Часовой пояс
        ms: Zon waktu
        pt-br: Fuso horário

    - envKey: SERVER_URL
      type: text
      default: handbrake-server
      required: true
      edit: true
      label:
        en: Server URL
        zh: server 地址
        zh-Hant: server 位址
        ja: サーバー URL
        ko: 서버 URL
        ru: URL сервера
        ms: URL Pelayan
        pt-br: URL do servidor

    - envKey: WORKER_ID
      type: text
      default: handbrake-worker-1
      required: true
      edit: true
      label:
        en: Worker ID
        zh: worker 标识
        zh-Hant: worker 識別
        ja: worker ID
        ko: worker ID
        ru: Worker ID
        ms: ID Worker
        pt-br: ID do Worker

    - envKey: MEDIA_PATH
      type: text
      default: ./data/media
      required: true
      edit: true
      label:
        en: Media Folder
        zh: 媒体目录
        zh-Hant: 媒體目錄
        ja: メディアフォルダー
        ko: 미디어 폴더
        ru: Медиа папка
        ms: Folder Media
        pt-br: Pasta de Mídia

    - default: 99
      edit: true
      envKey: UID
      labelEn: Run as UID
      labelZh: 运行用户 UID
      label:
        en: Run as UID
        zh: 运行用户 UID
        zh-Hant: 執行使用者 UID
        ja: 実行 UID
        ko: 실행 UID
        ru: UID пользователя
        ms: UID pengguna
        pt-br: UID do usuário
      required: true
      type: number
    - default: 100
      edit: true
      envKey: GID
      labelEn: Run as GID
      labelZh: 运行组 GID
      label:
        en: Run as GID
        zh: 运行组 GID
        zh-Hant: 執行群組 GID
        ja: 実行 GID
        ko: 실행 GID
        ru: GID группы пользователя
        ms: GID kumpulan pengguna
        pt-br: GID do grupo
      required: true
      type: number