# AGENTS.md 规约:
# - 主服务 container_name: ${CONTAINER_NAME}; 双 service 这里用 ${CONTAINER_NAME}-server / ${CONTAINER_NAME}-worker
# - restart: always; networks: [1panel-network] (external); labels: {createdBy: Apps}
# - 公开端口用 PANEL_APP_PORT_*; 卷用 ${MEDIA_PATH} (formField) + ./data/... 相对路径
# - "禁止 init: true" 对 distroless 不触发 (s6-overlay 禁忌)
# - 镜像用 GHCR latest (上游无 semver tag; 符合 AGENTS.md "latest 例外条款", 需在 commit message 注明)
#
# ⚠️ upstream 风险:
# - TheNickOfTime/handbrake-web issue #88 自述 "under heavy development"
# - 测试硬件: RTX 3070 (Turing CC 7.5); P620 (Pascal CC 6.1) 官方未验证
# - worker 镜像是 gcr.io/distroless/nodejs24-debian13:debug-nonroot (无 shell, debug 必须看 docker logs)
# - build.Dockerfile 自带 HandBrakeCLI 1.10.2 (比 linuxserver 主线 1.11.2 略旧; --enable-nvenc 已确认)
#
# ⚠️ NVIDIA 注入方式:
# - 官方 compose.nvidia.yaml (36 行) 仅用 deploy.resources.reservations.devices, 不用 NVIDIA_* env
# - nvidia-container-runtime 会自动注入 NVIDIA_VISIBLE_DEVICES / NVIDIA_DRIVER_CAPABILITIES / libnvidia-*.so
# - 不用 runtime: nvidia (那是 linuxserver s6 模型, 不适用 distroless)
# - 上游 setup guide 显式说 'Prefix with https:// if using TLS/SSL' (仅 SERVER_URL 加 https://, 内部 port 仍是 9999)

networks:
  1panel-network:
    external: true

services:
  handbrake-web-server:
    image: ghcr.io/thenickoftime/handbrake-web-server:latest
    # 以指定 UID/GID 运行（宿主机挂载目录需 chown 到同一属主，否则容器内无法写入）
    user: "${UID}:${GID}"
    container_name: ${CONTAINER_NAME}-server
    # 不写 user: 让容器以 root (uid 0) 跑.
    # 根因: 1Panel 部署时 ./data/server / ${MEDIA_PATH} 主机目录归 1panel 用户 (uid 非 1000) 拥有,
    #       distroless + TheNickOfTime 容器内 access('/data') 严格检查 uid=1000 写权限会 EACCES.
    # 官方 compose.nvidia.yaml 写 user: 1000:1000 是给 '用户自己 docker compose 部署' 场景,
    #       那种场景用户能自己 sudo chown. 1Panel 部署不暴露 chown 步骤.
    # 官方 setup guide 也说 'You may opt to run the container as root 0:0 to almost certainly
    #       bypass any permissions issues, but this is not recommended'.
    # 1Panel 场景下 'not recommended' 不适用, 'recommended' 是 PUID/PGID 模式但 1Panel 不支持.
    # 安全考虑: bind mount 只开 ./data/server + ${MEDIA_PATH}, root 容器在主机无其他访问.
    restart: always
    environment:
      - TZ=${TIME_ZONE}
      - NODE_ENV=production
      - HANDBRAKE_MODE=server # 跟随 server Dockerfile 行 49
      - DATA_PATH=/data
      - VIDEO_PATH=/video
    # AGENTS.md "持久化挂载优先 ./data/... 相对路径" 规约.
    # /data 内部状态 (preset 库, 任务队列) 用户不直接访问, 用相对路径 hardcode.
    # /video 媒体目录 用户在 MEDIA_PATH formField 填主机绝对路径 (默认 ./data/media).
    # 上游硬要求: 'the same media path must be mapped to /video across the server and all worker instances'
    # 1Panel 把 ./data/media 解析成 /opt/1panel/apps/handbrake-web/latest/data/media, user 改 formField 后变主机绝对路径.
    volumes:
      - ./data/server:/data
      - ${MEDIA_PATH}:/video
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
    ports:
      - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:9999
    # server 不读 NVIDIA_* (server 是 Node 协调器, 不跑 HandBrakeCLI)

  handbrake-web-worker:
    image: ghcr.io/thenickoftime/handbrake-web-worker:latest
    # 以指定 UID/GID 运行（宿主机挂载目录需 chown 到同一属主，否则容器内无法写入）
    user: "${UID}:${GID}"
    container_name: ${CONTAINER_NAME}-worker
    # 跟 server 一致, 不写 user: 让容器以 root 跑. 见 server 的 user 注释 (根因/取舍).
    # worker 同样需要写 ${MEDIA_PATH}:/video 主机目录, root 自动可写.
    restart: always
    environment:
      - TZ=${TIME_ZONE}
      - NODE_ENV=production
      - HANDBRAKE_MODE=worker # 跟随 worker Dockerfile 行 34
      - DATA_PATH=/tmp/handbrake-web # 跟随 worker Dockerfile 行 35
      - VIDEO_PATH=/video
      - WORKER_ID=${WORKER_ID}
      - SERVER_URL=${SERVER_URL}
      - SERVER_PORT=9999 # hardcode 跟随官方; worker→server 内部通信始终走 server Dockerfile EXPOSE 9999
    # NVIDIA 设备注入: docker compose 23.0+ 标准. 1Panel 主机 Docker 版本需 >= 19.03.
    # 官方 compose.nvidia.yaml 行 31-36 完整保留. capabilities: [gpu, compute, video] 含 video (NVENC 编码器).
    # nvidia-container-runtime 自动注入 NVIDIA_VISIBLE_DEVICES / NVIDIA_DRIVER_CAPABILITIES + libnvidia-*.so.
    # 不需要 (也不应该) 在 environment 里手动写 NVIDIA_* env, 那是死代码.
    volumes:
      - ${MEDIA_PATH}:/video # 跟 server 同一 MEDIA_PATH, 上游硬要求路径一致
    networks:
      - 1panel-network
    labels:
      createdBy: Apps
    depends_on:
      - handbrake-web-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities:
                - gpu
                - compute
                - video
    # ⚠️ 顶层 volumes 块: AGENTS.md 明确禁止 ${...} 插值命名卷, 全部改 ./data/... 或 formField 相对路径.
    # 本应用 server+worker 共享 /video 通过 ${MEDIA_PATH} formField 实现, 不需要任何顶层 named volume 块.
