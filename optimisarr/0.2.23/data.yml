  name: optimisarr 0.2.22
  tags:
    - Media
    - Transcoding
    - FFmpeg
  shortDescZh: 自托管 FFmpeg 媒体库优化器（带验证回滚的 Plex/Jellyfin/Emby 转码）
  shortDescEn: Self-hosted FFmpeg media-library optimiser with verified transcoding & rollback
  description:
    zh: 基于 Jellman86/optimisarr 的安全优先自托管 FFmpeg 媒体库优化器。验证通过后才替换原文件，原文件进入隔离区可回滚。支持 CPU、Intel QSV、VA-API、NVIDIA NVENC；可在 Plex/Jellyfin/Emby 正在串流时自动暂停处理。仅支持 linux/amd64（上游镜像仅发布 amd64 架构）。
    en: Safety-first, self-hosted FFmpeg media-library optimiser based on Jellman86/optimisarr. Verifies stream retention / duration / bitrate savings before replacing files; quarantines the original for rollback. Supports CPU, Intel QSV, VA-API and NVIDIA NVENC; automatically pauses while Plex / Jellyfin / Emby is streaming. linux/amd64 only (upstream image is amd64-only).
    ja: Jellman86/optimisarr をベースにした安全性を最優先にしたセルフホスト型 FFmpeg メディアライブラリ最適化ツール。ストリーム保持・再生時間・ビットレート削減を検証してからファイルを置き換え、原本は隔離してロールバック可能。CPU、Intel QSV、VA-API、NVIDIA NVENC に対応し、Plex / Jellyfin / Emby のストリーミング中は自動的に処理を一時停止。linux/amd64 のみ対応（アップストリームイメージは amd64 専用）。
    ko: Jellman86/optimisarr 기반의 안전 우선 자체 호스팅 FFmpeg 미디어 라이브러리 최적화 도구. 스트림 보존, 재생 시간, 비트레이트 절감을 검증한 후 파일을 교체하고 원본은 격리하여 롤백할 수 있습니다. CPU, Intel QSV, VA-API, NVIDIA NVENC를 지원하며 Plex / Jellyfin / Emby 스트리밍 중에는 자동으로 처리를 일시 중지합니다. linux/amd64만 지원(업스트림 이미지는 amd64 전용).
    ru: Безопасный самохостируемый оптимизатор медиатеки FFmpeg на базе Jellman86/optimisarr. Перед заменой файлов проверяет сохранение потоков, длительность и экономию битрейта; оригинал помещается в карантин для отката. Поддерживает CPU, Intel QSV, VA-API и NVIDIA NVENC; автоматически приостанавливает работу при стриминге Plex / Jellyfin / Emby. Только linux/amd64 (исходный образ только amd64).
    ms: Pengoptimum perpustakaan media FFmpeg kendiri-sendiri yang mengutamakan keselamatan berdasarkan Jellman86/optimisarr. Mengesahkan pengekalan strim, tempoh dan penjimatan bitrate sebelum menggantikan fail; mengasingkan asal untuk rollback. Menyokong CPU, Intel QSV, VA-API dan NVIDIA NVENC; menjeda secara automatik semasa Plex / Jellyfin / Emby menstrim. linux/amd64 sahaja (imej upstream hanya amd64).
    pt-br: Otimizador de biblioteca de mídia FFmpeg auto-hospedado com foco em segurança baseado em Jellman86/optimisarr. Verifica a retenção de fluxos, duração e economia de bitrate antes de substituir arquivos; coloca o original em quarentena para rollback. Suporta CPU, Intel QSV, VA-API e NVIDIA NVENC; pausa automaticamente durante streaming de Plex / Jellyfin / Emby. Apenas linux/amd64 (a imagem upstream é apenas amd64).
    zh-Hant: 基於 Jellman86/optimisarr 的安全優先自架 FFmpeg 媒體庫優化器。驗證通過後才替換原檔，原檔進入隔離區可回滾。支援 CPU、Intel QSV、VA-API、NVIDIA NVENC；當 Plex / Jellyfin / Emby 正在串流時會自動暫停處理。僅支援 linux/amd64（上游映像檔僅發佈 amd64 架構）。
