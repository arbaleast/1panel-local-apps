networks:
  1panel-network:
    external: true
services:
  perplexica:
    container_name: ${CONTAINER_NAME}
    # 以指定 UID/GID 运行（宿主机挂载目录需 chown 到同一属主，否则容器内无法写入）
    user: "${UID}:${GID}"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    environment:
    - PORT=3000
    - AI_PROVIDER=${AI_PROVIDER}
    - AI_MODEL=${AI_MODEL}
    - API_KEY=${API_KEY}
    - API_URL=${API_URL}
    - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD}
    - SEARXNG_API_URL=${SEARXNG_API_URL}
    image: itzcrazykns1337/vane:full-v1.12.2-arm64
    labels:
      createdBy: Apps
    networks:
    - 1panel-network
    ports:
    - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:3000
    restart: always
    volumes:
    - ./data:/app/server/lib/db
