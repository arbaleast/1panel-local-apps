      envKey: IMAGE
      labelEn: Image
      labelZh: 镜像
      label:
        en: Image
        zh: 镜像
        ja: イメージ
        ko: 이미지
        ru: Образ
        ms: Imej
        pt-br: Imagem
        es-es: Imagen
        tr: İmaj
        zh-Hant: 映像
      required: true
