name: LlamaIndex
title: LlamaIndex — AI RAG 与 Agent 框架
description:
  zh: LlamaIndex RAG 与 Agent 框架，连接本地 Ollama LLM 提供文档索引和智能问答。
  en: LlamaIndex RAG and Agent framework, connecting to local Ollama LLM for document indexing and intelligent Q&A.
additionalProperties:
  key: llamaindex
  name: llamaindex
  tags:
  - AI
  - RAG
  shortDescZh: LlamaIndex RAG + Agent 连接 Ollama 本地 LLM
  shortDescEn: LlamaIndex RAG + Agent with local Ollama LLM
  description:
    zh: LlamaIndex RAG 与 Agent 框架，连接本地 Ollama LLM 提供文档索引和智能问答。
    en: LlamaIndex RAG and Agent framework, connecting to local Ollama LLM for document indexing and intelligent Q&A.
  type: tool
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://docs.llamaindex.ai/
  github: https://github.com/run-llama/llama_index
  document: https://docs.llamaindex.ai/
  formFields:
  - default: run-llama/llama-agents-server:latest
    edit: true
    envKey: IMAGE
    labelEn: Docker Image
    labelZh: Docker 镜像
    label:
      en: Docker Image
      zh: Docker 镜像
      zh-Hant: Docker 鏡像
      ja: Docker イメージ
      ko: Docker 이미지
      ru: Docker образ
      ms: Imej Docker
      pt-br: Imagem Docker
    required: true
    type: text
    rule: paramImageTag
  - default: llamaindex
    edit: true
    envKey: CONTAINER_NAME
    labelEn: Container Name
    labelZh: 容器名称
    label:
      en: Container Name
      zh: 容器名称
      zh-Hant: 容器名稱
      ja: コンテナ名
      ko: 컨테이너 이름
      ru: Имя контейнера
      ms: Nama bekas
      pt-br: Nome do contêiner
    required: true
    type: text
  - default: llamaindex_data
    edit: true
    envKey: DATA_PATH
    labelEn: Data Path
    labelZh: 数据路径
    label:
      en: Data Path
      zh: 数据路径
      zh-Hant: 資料路徑
      ja: データパス
      ko: 데이터 경로
      ru: Путь к данным
      ms: Laluan data
      pt-br: Caminho de dados
    required: true
    type: text
    rule: paramPath
  - default: '8000'
    edit: true
    envKey: PANEL_APP_PORT_HTTP
    labelEn: Host HTTP Port
    labelZh: 宿主机端口
    label:
      en: Host HTTP Port
      zh: 宿主机端口
      zh-Hant: 主機埠
      ja: ホスト側ポート
      ko: 호스트 포트
      ru: Порт на хосте
      ms: Port hos
      pt-br: Porta no host
    required: true
    type: number
    rule: paramPort
  - default: http://host.docker.internal:11434
    edit: true
    envKey: OLLAMA_BASE_URL
    labelEn: Ollama Base URL
    labelZh: Ollama 服务地址
    label:
      en: Ollama Base URL
      zh: Ollama 服务地址
      zh-Hant: Ollama 服務地址
      ja: Ollama ベース URL
      ko: Ollama 베이스 URL
      ru: Ollama базовый URL
      ms: URL asas Ollama
      pt-br: URL base do Ollama
    required: true
    type: text
    rule: paramHttp
  - default: llama3.2
    edit: true
    envKey: OLLAMA_MODEL
    labelEn: Ollama Model
    labelZh: Ollama 模型
    label:
      en: Ollama Model
      zh: Ollama 模型
      zh-Hant: Ollama 模型
      ja: Ollama モデル
      ko: Ollama 모델
      ru: Ollama модель
      ms: Model Ollama
      pt-br: Modelo Ollama
    required: true
    type: text
  - default: llama3.2
    edit: true
    envKey: OLLAMA_EMBEDDING_MODEL
    labelEn: Embedding Model
    labelZh: Embedding 模型
    label:
      en: Embedding Model
      zh: Embedding 模型
      zh-Hant: Embedding 模型
      ja: Embedding モデル
      ko: Embedding 모델
      ru: Embedding модель
      ms: Model Embedding
      pt-br: Modelo de Embedding
    required: true
    type: text
  - default: 'true'
    edit: true
    envKey: OLLAMA_EMBEDDING_DISABLED
    labelEn: Disable Embedding
    labelZh: 禁用 Embedding
    label:
      en: Disable Embedding
      zh: 禁用 Embedding
      zh-Hant: 停用 Embedding
      ja: Embedding を無効化
      ko: Embedding 비활성화
      ru: Отключить Embedding
      ms: Lumpuhkan Embedding
      pt-br: Desativar Embedding
    required: true
    type: select
    rule: paramSelect
    values:
    - label: 启用
      value: 'false'
    - label: 禁用
      value: 'true'
  - default: ./data/storage
    edit: true
    envKey: PERSIST_DIR
    labelEn: Persist Directory
    labelZh: 持久化目录
    label:
      en: Persist Directory
      zh: 持久化目录
      zh-Hant: 持久化目錄
      ja: 永続化ディレクトリ
      ko: 지속 디렉토리
      ru: Каталог персистентности
      ms: Direktori Kekal
      pt-br: Diretório de persistência
    required: true
    type: text
    rule: paramPath
  - default: 'false'
    edit: true
    envKey: ENABLE_HUMAN_IN_LOOP
    labelEn: Human-in-the-Loop
    labelZh: 启用人工介入
    label:
      en: Human-in-the-Loop
      zh: 启用人工介入
      zh-Hant: 啟用人工介入
      ja: 人間介入手順
      ko: Human-in-the-Loop
      ru: Человек в контуре
      ms: Manusia-dalam-kitaran
      pt-br: Humano no circuito
    required: true
    type: select
    rule: paramSelect
    values:
    - label: 启用
      value: 'true'
    - label: 禁用
      value: 'false'
  - default: Asia/Shanghai
    edit: true
    envKey: TZ
    labelEn: Timezone
    labelZh: 时区
    label:
      en: Timezone
      zh: 时区
      zh-Hant: 時區
      ja: タイムゾーン
      ko: 시간대
      ru: Часовой пояс
      ms: Zon waktu
      pt-br: Fuso horário
    required: true
    type: text
