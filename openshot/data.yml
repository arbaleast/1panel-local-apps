additionalProperties:
  key: openshot
  name: OpenShot
  tags:
    - Local
    - video
    - editor
    - animation
  shortDescZh: OpenShot 开源视频剪辑与动画制作 (浏览器 GUI, 仅 amd64)
  shortDescEn: OpenShot open-source video editor and animator (browser GUI, amd64 only)
  description:
    zh: 基于 linuxserver.io 官方镜像的 OpenShot 开源视频剪辑与动画制作工具。通过 Selkies WebRTC 在浏览器中直接使用完整 OpenShot 桌面版，无需安装本地客户端。支持保留媒体目录挂载变量（素材库以宿主机绝对路径挂入容器 /storage），并内置 NVIDIA GPU 硬件加速（NVENC 编码 / GPU 预览加速），已针对 NVIDIA Quadro P620（Pascal 架构）调优。上游镜像仅发布 linux/amd64 单架构。
    en: OpenShot open-source video editor and animator from the official linuxserver.io image. The full OpenShot desktop application runs in the browser through Selkies WebRTC with no local client installation required. Keeps a media-directory mount variable so footage libraries are mounted straight from the host, and ships NVIDIA GPU acceleration (NVENC encoding / GPU preview) tuned for the NVIDIA Quadro P620 (Pascal architecture). The upstream image is published for linux/amd64 only.
    zh-Hant: 基於 linuxserver.io 官方映像的 OpenShot 開源影片剪輯與動畫製作工具。透過 Selkies WebRTC 直接在瀏覽器中使用完整 OpenShot 桌面版，無需安裝本機用戶端。支援保留媒體目錄掛載變數（素材庫以主機絕對路徑掛入容器 /storage），並內建 NVIDIA GPU 硬體加速（NVENC 編碼 / GPU 預覽加速），已針對 NVIDIA Quadro P620（Pascal 架構）調校。上游映像僅發布 linux/amd64 單一架構。
    ja: linuxserver.io 公式イメージベースの OpenShot オープンソース動画編集・アニメーション作成ソフト。Selkies WebRTC 経由でフル OpenShot デスクトップ版をブラウザ上で直接使え、ローカルクライアントのインストールは不要。メディアディレクトリのマウント変数を保持し、素材ライブラリをホストの絶対パスから直接マウントでき、NVIDIA GPU ハードウェアアクセラレーション（NVENC エンコード / GPU プレビュー）を内蔵し、NVIDIA Quadro P620（Pascal アーキテクチャ）向けに調整済み。上游イメージは linux/amd64 のみ公開されています。
    ko: linuxserver.io 공식 이미지 기반 OpenShot 오픈소스 비디오 편집 및 애니메이션 제작 도구. Selkies WebRTC를 통해 전체 OpenShot 데스크톱 애플리케이션을 브라우저에서 직접 사용할 수 있어 로컬 클라이언트 설치가 필요 없습니다. 미디어 디렉터리 마운트 변수를 유지해 소재 라이브러리를 호스트 절대 경로에서 직접 마운트하며, NVIDIA GPU 하드웨어 가속(NVENC 인코딩 / GPU 미리보기)이 내장되어 NVIDIA Quadro P620(Pascal 아키텍처)에 맞춰 조정되었습니다. 상위 이미지는 linux/amd64 단일 아키텍처로만 제공됩니다.
    ru: OpenShot — бесплатный видеоредактор и аниматор на базе официального образа linuxserver.io. Полная настольная версия OpenShot запускается прямо в браузере через Selkies WebRTC, локальная установка не требуется. Сохраняет переменную монтирования медиакаталога, так что библиотеки исходников подключаются напрямую с хоста, и включает аппаратное ускорение NVIDIA GPU (кодирование NVENC / ускорение превью), настроенное под NVIDIA Quadro P620 (архитектура Pascal). Верхний образ публикуется только для linux/amd64.
    ms: OpenShot — editor video dan animasi sumber terbuka berdasarkan imej rasmi linuxserver.io. Versi desktop penuh OpenShot berjalan terus dalam pelayar melalui Selkies WebRTC, tanpa perlu pemasangan klien tempatan. Ia mengekalkan pemboleh mount direktori media supaya pustaka bahan mentah dipasang terus daripada hos, dan menyertakan pecutan perkakasan GPU NVIDIA (penyencodingan NVENC / pratonton dipercepat), yang ditala untuk NVIDIA Quadro P620 (seni bina Pascal). Imej hulu Nadu hanya diterbitkan untuk linux/amd64.
    pt-br: OpenShot — editor de vídeo e animador de código aberto baseado na imagem oficial do linuxserver.io. A versão desktop completa do OpenShot roda direto no navegador via Selkies WebRTC, sem instalação de cliente local. Mantém uma variável de montagem de diretório de mídia para que as bibliotecas de material bruto sejam montadas direto do host, e inclui aceleração de hardware GPU NVIDIA (codificação NVENC / pré-visualização acelerada) ajustada para a NVIDIA Quadro P620 (arquitetura Pascal). A imagem upstream é publicada apenas para linux/amd64.
  type: media
  architectures:
    - amd64
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://www.openshot.org/
  github: https://github.com/OpenShot/openshot-qt
  document: https://docs.linuxserver.io/images/docker-openshot/
