additionalProperties:
  key: bookorbit
  name: bookorbit 3.4.0
  tags:
    - Book
    - Library
    - Reader
    - Self-hosted
    - EPUB
    - Audiobook
    - Comic
    - PDF
    - KOReader
    - Kobo
    - OIDC
  shortDescZh: 自托管电子书 / 漫画 / 有声书 / PDF 库（KOReader / Kobo 双向同步 + 多用户 + OIDC/SSO）
  shortDescEn: Self-hosted library for ebooks, audiobooks, comics and PDFs (KOReader/Kobo two-way sync + multi-user + OIDC/SSO)
  description:
    zh: BookOrbit v3.4.0 — 上游 [bookorbit/bookorbit](https://github.com/bookorbit/bookorbit) 3.4.0 release。镜像：ghcr.io/bookorbit/bookorbit:3.4.0（多架构 linux/amd64 + linux/arm64）。本应用不捆绑数据库，需先部署本仓 pgvector/ 应用（PostgreSQL 18 + pgvector，含 uuid-ossp / pg_trgm / unaccent / vector 四个必需扩展），再填其容器名与随机账号连接。新增电子+有声书成对请求、iOS 1.5 audiobook 跟读（Text/Lyrics/Page 三态、timed text 高亮 narration）、iOS 1.5 全套重建 widgets + Control Center actions、Nostalgia 主题（封面按主格式自适应形状）、可配置 read-aloud EPUB 投递（Kobo / KOReader / OPDS / email）、元数据搜索可缓存（缓存寿命 + 缺字段提醒 + 不自动搜）、多文件书籍无损写元数据（保留 ID / creator role / extended tags / 文件权限）；另含 iOS 1.5 完整元数据编辑器与多项 audiobook / metadata / koreader / client 修复。
    en: "BookOrbit v3.4.0 — upstream [bookorbit/bookorbit](https://github.com/bookorbit/bookorbit) 3.4.0 release. Image: ghcr.io/bookorbit/bookorbit:3.4.0 (multi-arch linux/amd64 + linux/arm64). This app bundles no database: deploy the repo's pgvector/ app first (PostgreSQL 18 + pgvector with the four required extensions uuid-ossp / pg_trgm / unaccent / vector), then enter its container name and random credentials. Adds paired ebook + audiobook requests, iOS 1.5 read-aloud Text/Lyrics/Page playback with timed-text highlighting, rebuilt iOS 1.5 widgets and Control Center actions, the Nostalgia appearance style with format-shaped covers, configurable read-aloud EPUB delivery through Kobo / KOReader / OPDS / email, cached metadata provider results with cache lifetime and missing-field reminders, and lossless multi-file metadata writes that preserve identifiers, creator roles, extended tags and file permissions. Plus the complete iOS 1.5 metadata editor and assorted audiobook / metadata / koreader / client fixes."
  type: library
  architectures:
    - amd64
    - arm64
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://bookorbit.app
  github: https://github.com/bookorbit/bookorbit
  document: https://bookorbit.app/installation
  formFields:
    - default: ghcr.io/bookorbit/bookorbit
      edit: true
      envKey: APP_IMAGE
      labelEn: App Image
      labelZh: 应用镜像
      label:
        en: App Image
        zh: 应用镜像
        zh-Hant: 應用映像
        ja: アプリイメージ
        ko: 앱 이미지
        ru: Образ приложения
        ms: Imej Aplikasi
        pt-br: Imagem do app
      required: true
      rule: paramImageTag
      type: text
    - default: 3.5.0
      edit: true
      envKey: APP_VERSION
      labelEn: App Version
      labelZh: 应用版本
      label:
        en: App Version
        zh: 应用版本
        zh-Hant: 應用版本
        ja: アプリバージョン
        ko: 앱 버전
        ru: Версия приложения
        ms: Versi Aplikasi
        pt-br: Versão do app
      required: true
      rule: paramImageTag
      type: text
    - default: 48300
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 連接埠
        ja: HTTP ポート
        ko: HTTP 포트
        ru: HTTP-порт
        ms: Port HTTP
        pt-br: Porta HTTP
      required: true
      rule: paramPort
      type: number
    - default: 1Panel-postgresql-ZU4y
      edit: true
      envKey: POSTGRES_HOST
      labelEn: PostgreSQL Host
      labelZh: PostgreSQL 主机
      label:
        en: PostgreSQL host (prefilled 1Panel-postgresql container name - verify)
        zh: PostgreSQL 主机（已预填 1Panel-postgresql 容器名 — 请核对）
        zh-Hant: PostgreSQL 主機（已預填 1Panel-postgresql 容器名 — 請核對）
        ja: PostgreSQL ホスト（1Panel-postgresql コンテナ名をプレフィル — 確認してください）
        ko: PostgreSQL 호스트 (1Panel-postgresql 컨테이너 이름 미리 채움 — 확인하세요)
        ru: Хост PostgreSQL (имя контейнера 1Panel-postgresql предзаполнено — проверьте)
        ms: Hos PostgreSQL (nama bekas 1Panel-postgresql telah diisi awal — sahkan)
        pt-br: Host PostgreSQL (nome do contêiner 1Panel-postgresql pré-preenchido — verifique)
      required: true
      rule: paramCommon
      type: text
    - default: "5432"
      edit: true
      envKey: POSTGRES_PORT
      labelEn: PostgreSQL Port
      labelZh: PostgreSQL 端口
      label:
        en: PostgreSQL Port (default 5432)
        zh: PostgreSQL 端口（默认 5432）
        zh-Hant: PostgreSQL 連接埠（預設 5432）
        ja: PostgreSQL ポート（デフォルト 5432）
        ko: PostgreSQL 포트 (기본 5432)
        ru: Порт PostgreSQL (по умолчанию 5432)
        ms: Port PostgreSQL (lalai 5432)
        pt-br: Porta PostgreSQL (padrão 5432)
      required: true
      rule: paramPort
      type: number
    - default: user_wEJsSp
      edit: true
      envKey: POSTGRES_USER
      labelEn: PostgreSQL User
      labelZh: PostgreSQL 用户名
      label:
        en: PostgreSQL user (prefilled 1Panel-postgresql random user - verify)
        zh: PostgreSQL 用户名（已预填 1Panel-postgresql 随机用户 — 请核对）
        zh-Hant: PostgreSQL 使用者名稱（已預填 1Panel-postgresql 隨機使用者 — 請核對）
        ja: PostgreSQL ユーザー名（1Panel-postgresql ランダムユーザーをプレフィル — 確認してください）
        ko: PostgreSQL 사용자 이름 (1Panel-postgresql 임의 사용자를 미리 채움 — 확인하세요)
        ru: Пользователь PostgreSQL (случайный пользователь 1Panel-postgresql предзаполнен — проверьте)
        ms: Nama pengguna PostgreSQL (pengguna rawak 1Panel-postgresql telah diisi awal — sahkan)
        pt-br: Usuário PostgreSQL (usuário aleatório do 1Panel-postgresql pré-preenchido — verifique)
      required: true
      rule: paramCommon
      type: text
    - default: password_tyrcEJ
      edit: true
      envKey: POSTGRES_PASSWORD
      labelEn: PostgreSQL Password
      labelZh: PostgreSQL 密码
      label:
        en: PostgreSQL password (prefilled from 1Panel-postgresql - change if you rotated it)
        zh: PostgreSQL 密码（已预填 1Panel-postgresql 密码 — 若已轮换请修改）
        zh-Hant: PostgreSQL 密碼（已預填 1Panel-postgresql 密碼 — 若已輪換請修改）
        ja: PostgreSQL パスワード（1Panel-postgresql の値をプレフィル — 変更済みなら修正）
        ko: PostgreSQL 비밀번호 (1Panel-postgresql 값 미리 채움 — 변경했다면 수정)
        ru: Пароль PostgreSQL (предзаполнено из 1Panel-postgresql — измените, если ротировали)
        ms: Kata laluan PostgreSQL (diisi awal daripada 1Panel-postgresql — ubah jika telah diputar)
        pt-br: Senha PostgreSQL (pré-preenchido do 1Panel-postgresql — altere se já rotacionou)
      required: true
      type: password
    - default: ""
      edit: true
      envKey: POSTGRES_DB
      labelEn: PostgreSQL Database
      labelZh: PostgreSQL 数据库名
      label:
        en: PostgreSQL database name (REQUIRED, left blank on purpose - fill at deploy time)
        zh: PostgreSQL 数据库名（必填，故意留空 — 部署时手填）
        zh-Hant: PostgreSQL 資料庫名（必填，故意留空 — 部署時手填）
        ja: PostgreSQL データベース名（必須，故意に空欄 — 配置時に記入）
        ko: PostgreSQL 데이터베이스 이름 (필수, 의도적으로 비워둠 — 배포 시 입력)
        ru: Имя базы PostgreSQL (обязательно, намеренно пусто — заполните при установке)
        ms: Nama pangkalan data PostgreSQL (wajib, sengaja kosong — isi semasa pemasangan)
        pt-br: Nome do banco PostgreSQL (obrigatório, vazio de propósito — preencha na instalação)
      required: true
      rule: paramCommon
      type: text
    - default: ""
      edit: true
      envKey: JWT_SECRET
      labelEn: JWT Secret (optional)
      labelZh: JWT 签名密钥（可空）
      label:
        en: JWT Secret (optional - leave blank to auto-generate)
        zh: JWT 签名密钥（可空 — 留空则自动生成）
        zh-Hant: JWT 簽名密鑰（可空 — 留空則自動生成）
        ja: JWT 署名鍵（任意 — 空欄なら自動生成）
        ko: JWT 서명 키 (선택 — 비워두면 자동 생성)
        ru: Секрет подписи JWT (необязательно — пусто = сгенерируется автоматически)
        ms: Kunci tandatangan JWT (pilihan — kosong = dijana automatik)
        pt-br: Chave de assinatura JWT (opcional — vazio = gerada automaticamente)
      required: false
      type: password
    - default: ""
      edit: true
      envKey: SETUP_BOOTSTRAP_TOKEN
      labelEn: Setup Token (optional)
      labelZh: 安装引导 Token（可空）
      label:
        en: Setup Token (optional - blank = anyone can claim first admin)
        zh: 安装引导 Token（可空 — 留空则任何人都能抢先建管理员）
        zh-Hant: 安裝引導 Token（可空 — 留空則任何人都能搶先建管理員）
        ja: セットアップ Token（任意 — 空欄なら誰でも最初の管理者を作成可）
        ko: 설치 Token (선택 — 비워두면 누구나 첫 관리자 계정 생성 가능)
        ru: Токен настройки (необязательно — пусто = первый админ доступен любому)
        ms: Token Setup (pilihan — kosong = sesiapa boleh jadi admin pertama)
        pt-br: Token de configuração (opcional — vazio = qualquer um pode criar o 1º admin)
      required: false
      type: password
    - default: ""
      edit: true
      envKey: APP_URL
      labelEn: External URL (optional)
      labelZh: 外部访问 URL（可空）
      label:
        en: External URL (optional - needed for Kobo sync and email links)
        zh: 外部访问 URL（可空 — Kobo 同步与邮件链接需用）
        zh-Hant: 外部存取 URL（可空 — Kobo 同步與郵件連結需用）
        ja: 外部 URL（任意 — Kobo 同期とメールリンクに必要）
        ko: 외부 URL (선택 — Kobo 동기화 및 이메일 링크에 필요)
        ru: Внешний URL (необязательно — нужен для синхронизации Kobo и ссылок в письмах)
        ms: URL Luaran (pilihan — diperlukan untuk penyegerakan Kobo dan pautan e-mel)
        pt-br: URL externo (opcional — necessário para sincronização Kobo e links de e-mail)
      required: false
      type: text
    - default: "99"
      edit: true
      envKey: PUID
      labelEn: Process UID
      labelZh: 容器进程 UID
      label:
        en: Process UID
        zh: 容器进程 UID
        zh-Hant: 容器行程 UID
        ja: コンテナプロセス UID
        ko: 컨테이너 프로세스 UID
        ru: UID процесса
        ms: UID Proses
        pt-br: UID do processo
      required: false
      rule: paramCommon
      type: number
    - default: "100"
      edit: true
      envKey: PGID
      labelEn: Process GID
      labelZh: 容器进程 GID
      label:
        en: Process GID
        zh: 容器进程 GID
        zh-Hant: 容器行程 GID
        ja: コンテナプロセス GID
        ko: 컨테이너 프로세스 GID
        ru: GID процесса
        ms: GID Proses
        pt-br: GID do processo
      required: false
      rule: paramCommon
      type: number
    - default: auto
      edit: true
      envKey: NODE_MAX_OLD_SPACE_SIZE
      labelEn: Node.js Heap (MB)
      labelZh: Node.js 堆内存 (MB)
      label:
        en: Node.js Heap (MB)
        zh: Node.js 堆内存 (MB)
        zh-Hant: Node.js 堆積記憶體 (MB)
        ja: Node.js ヒープ (MB)
        ko: Node.js 힙 메모리 (MB)
        ru: Кучная память Node.js (МБ)
        ms: Timbunan Node.js (MB)
        pt-br: Memória heap do Node.js (MB)
      required: false
      rule: paramCommon
      type: text
    - default: Asia/Shanghai
      edit: true
      envKey: TZ
      labelEn: Timezone (IANA name)
      labelZh: 时区（IANA 名称）
      label:
        en: Timezone (IANA name, e.g. Asia/Shanghai or UTC)
        zh: 时区（IANA 名称，如 Asia/Shanghai 或 UTC）
        zh-Hant: 時區（IANA 名稱，如 Asia/Shanghai 或 UTC）
        ja: "タイムゾーン（IANA 名、例: Asia/Shanghai / UTC）"
        ko: "시간대 (IANA 이름, 예: Asia/Shanghai 또는 UTC)"
        ru: Часовой пояс (имя IANA, напр. Asia/Shanghai или UTC)
        ms: Zon masa (nama IANA, cth. Asia/Shanghai atau UTC)
        pt-br: Fuso horário (nome IANA, ex. Asia/Shanghai ou UTC)
      required: false
      type: text
