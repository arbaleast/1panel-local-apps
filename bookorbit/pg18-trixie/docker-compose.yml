# ============================================================
# BookOrbit (v3.2.0) — Self-hosted library for ebooks / audiobooks / comics / PDFs
#   上游项目: <https://github.com/bookorbit/bookorbit>
#   上游 Docker 镜像: ghcr.io/bookorbit/bookorbit (多架构 linux/amd64 + linux/arm64)
#   上游 .env 模板: <https://github.com/bookorbit/bookorbit/blob/main/.env.example>
#   上游 docker-compose 模板: <https://github.com/bookorbit/bookorbit/blob/main/docker-compose.yml>
#   上游安装文档: <https://bookorbit.app/installation>
#
# 数据流（与上游 docker-compose.yml 等价）：
#   主机侧 ./data/books        → 容器 /books          （电子书 / 漫画 / 有声书 / PDF）
#   主机侧 ./data/app          → 容器 /data           （应用配置 / 缓存 / 上传）
#   主机侧 ./data/postgres     → 容器 /var/lib/postgresql/data （PostgreSQL 18 + pgvector）
#
# 关键设计点：
#   1. app 与 postgres 两个服务通过 1panel-network 互联。
#      app depends_on postgres: condition: service_healthy，
#      PostgreSQL 健康检查通过后才拉起 app。
#   2. 上游 POSTGRES_PASSWORD / JWT_SECRET / SETUP_BOOTSTRAP_TOKEN 三个变量是 required，
#      docker-compose 强校验（?required），1Panel 表单中也以 rule: paramComplexity
#      required: true 强制用户提交非空值，提交时空会被前端拒。
#   3. PUID / PGID 默认 1000/1000。
#      上游会自动修复 /data 目录的属主，但不会动 /books ——
#      若宿主机 ./data/books 不属于 1000:1000（如 NAS 套件中的其他用户），
#      请在主机侧手动 chown -R <uid>:<gid> ./data/books 后再启动，
#      否则扫描会因 EACCES 找不到书。
#   4. APP_URL 影响 Kobo 端点回调与邮件链接；公网部署须填 https://your-domain，
#      反向代理后通过反代访问本机 48300 端口。
#   5. NODE_MAX_OLD_SPACE_SIZE=auto 让容器按自身规格自适应；
#      250K+ 书的库建议显式设 4096 或 8192 防止 OOM。
#   6. 持久化：./data/{app,postgres} 均为相对路径 bind mount，
#      不引入顶层 volumes: 块（符合本仓规约 + 1Panel schema）。
# ============================================================

networks:
  1panel-network:
    external: true

services:
  # 主应用：BookOrbit Web（Node.js 服务，监听容器内 3000）
  app:
    container_name: ${CONTAINER_NAME}
    image: ${APP_IMAGE}:${APP_VERSION}
    restart: always
    init: true
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:3000
    environment:
      NODE_ENV: production
      PORT: "3000"
      # 应用密钥（POSTGRES_* 必填项 + JWT/SETUP 必填项，docker-compose 强校验）
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, please set it in 1Panel app form}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required, please set it in 1Panel app form}
      SETUP_BOOTSTRAP_TOKEN: ${SETUP_BOOTSTRAP_TOKEN:?SETUP_BOOTSTRAP_TOKEN is required, please set it in 1Panel app form}
      # 外部访问 URL（影响 Kobo 端点 / 邮件链接）
      APP_URL: ${APP_URL:?APP_URL is required, please set it in 1Panel app form}
      # 时区
      TZ: ${TZ}
      # 容器进程 UID/GID（NAS 套件常需对齐宿主机 books 目录属主）
      PUID: ${PUID}
      PGID: ${PGID}
      # Node.js 堆内存上限（auto = 容器自适应；大库建议显式设大值）
      NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE}
    volumes:
      # 书架：宿主 ./data/books → 容器 /books（电子书 / 漫画 / 有声书 / PDF 库源）
      - ./data/books:/books
      # 应用数据：宿主 ./data/app → 容器 /data（配置 / 缓存 / 上传）
      - ./data/app:/data
    read_only: false
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      # /live 端点为上游 liveness probe
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/live"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # 持久化数据库：PostgreSQL 18 + pgvector（uuid-ossp / pg_trgm / unaccent / vector）
  postgres:
    container_name: ${CONTAINER_NAME}-postgres
    image: pgvector/pgvector:pg18-trixie
    restart: always
    init: true
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, please set it in 1Panel app form}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: ${TZ}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # 持久化主数据（注意 PGDATA 已含 pgdata 子目录，绑到 /var/lib/postgresql/data）
      - ./data/postgres:/var/lib/postgresql/data
    ports:
      - ${HOST_IP}:${PANEL_DB_PORT}:5432
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
