  shortDescZh: 自托管电子书 / 漫画 / 有声书 / PDF 库（KOReader / Kobo 双向同步 + 多用户 + OIDC/SSO）
  shortDescEn: Self-hosted library for ebooks, audiobooks, comics and PDFs (KOReader/Kobo two-way sync + multi-user + OIDC/SSO)
  description:
    zh: 'BookOrbit 是 neon 开发的开源自托管数字阅读平台，统一管理你的电子书 / 有声书 / 漫画 / PDF。原生内置浏览器阅读器（EPUB / KEPUB / MOBI / AZW3 / FB2 / PDF / CBZ / CBR / M4B / MP3 等），无需额外插件；支持 iPhone / Apple Watch 原生 App 离线下载与播放同步；Kobo / KOReader / BookOrbit 三方阅读进度与高亮双向同步；14 个元数据来源（Google Books / Open Library / Amazon / Goodreads / Audible / Hardcover / StoryGraph / ComicVine / RanobeDB / Aladin 等），全可编辑；多用户隔离 + 细粒度权限，原生支持 Authentik / Keycloak / Authelia 的 OIDC/SSO；OPDS / Send-to-Kindle / Hardcover / Readwise / StoryGraph 自动同步；统计、目标、50+ 成就与"Reading DNA"个人风格画像。数据库为外接 PostgreSQL 18 + pgvector（本仓 pgvector/ 应用已含 uuid-ossp / pg_trgm / unaccent / vector 四个必需扩展），需先部署该应用再安装本应用。Docker 镜像为 ghcr.io/bookorbit/bookorbit，AGPL-3.0。'
    en: 'BookOrbit is an open-source self-hosted digital reading platform from neon that unifies your ebooks, audiobooks, comics, and PDFs. Built-in browser readers handle EPUB, KEPUB, MOBI, AZW3, FB2, PDF, CBZ/CBR/CB7, and M4B/MP3/M4A/OPUS/OGG/FLAC audiobooks with no plugins required. The native iPhone and Apple Watch apps sync reading progress, highlights, and offline downloads. Three-way sync between Kobo, KOReader, and BookOrbit keeps progress and annotations flowing across devices. Fourteen metadata providers (Google Books, Open Library, Amazon, Goodreads, Audible, Audnexus, Libro.fm, iTunes, Hardcover, StoryGraph, ComicVine, RanobeDB, Aladin, Lubimyczytac) supply editable cover art and book data. Multi-user accounts with per-user permissions plus native OIDC/SSO via Authentik, Keycloak, and Authelia. OPDS feeds, Send-to-Kindle, automatic Hardcover/Readwise/StoryGraph sync, and a Book Dock drop folder for hands-free importing round out the delivery surface. Statistics, goals, 50+ achievements, and a Reading DNA profile round out the experience. Docker image is ghcr.io/bookorbit/bookorbit; licensed under AGPL-3.0.'
    zh-Hant: 'BookOrbit 是 neon 開發的開源自託管數位閱讀平台，統一管理你的電子書 / 有聲書 / 漫畫 / PDF。原生內建瀏覽器閱讀器（EPUB / KEPUB / MOBI / AZW3 / FB2 / PDF / CBZ / CBR / M4B / MP3 等），無需額外插件；支援 iPhone / Apple Watch 原生 App 離線下載與播放同步；Kobo / KOReader / BookOrbit 三方閱讀進度與高亮雙向同步；14 個中繼資料來源（Google Books / Open Library / Amazon / Goodreads / Audible / Hardcover / StoryGraph / ComicVine / RanobeDB / Aladin 等），皆可編輯；多用戶隔離 + 細粒度權限，原生支援 Authentik / Keycloak / Authelia 的 OIDC/SSO；OPDS / Send-to-Kindle / Hardcover / Readwise / StoryGraph 自動同步；統計、目標、50+ 成就與「Reading DNA」個人風格畫像。Docker 映像為 ghcr.io/bookorbit/bookorbit，AGPL-3.0。'
    ja: 'BookOrbit は neon 氏が開発した、電子書籍・オーディオブック・コミック・PDF を一元管理するオープンソースのセルフホスト型読書プラットフォームです。EPUB / KEPUB / MOBI / AZW3 / FB2 / PDF / CBZ / CBR / M4B / MP3 などを追加プラグインなしで読み取れる内蔵ブラウザリーダーを搭載。iPhone / Apple Watch ネイティブアプリがオフラインでのダウンロードと再生進捗を同期。Kobo / KOReader / BookOrbit の 3 方向で進捗とハイライトを双方向同期。Google Books / Open Library / Amazon / Goodreads / Audible / Audnexus / Libro.fm / iTunes / Hardcover / StoryGraph / ComicVine / RanobeDB / Aladin / Lubimyczytac といった 14 のメタデータプロバイダから書誌を取得し、編集可能。Authentik / Keycloak / Authelia の OIDC/SSO をネイティブにサポートするマルチユーザーと細粒度の権限管理。OPDS / Send-to-Kindle、Hardcover / Readwise / StoryGraph への自動同期、Book Dock ドロップフォルダによる自動取り込みも利用可能。統計、目標、50 以上の実績、Reading DNA プロフィールで読書傾向を可視化。Docker イメージは ghcr.io/bookorbit/bookorbit、ライセンスは AGPL-3.0。'
    ko: 'BookOrbit는 neon이 개발한 오픈 소스 셀프 호스팅 디지털 독서 플랫폼으로, 전자책 / 오디오북 / 만화 / PDF를 통합 관리합니다. 추가 플러그인 없이 EPUB / KEPUB / MOBI / AZW3 / FB2 / PDF / CBZ / CBR / M4B / MP3 등을 지원하는 내장 브라우저 리더를 제공하며, iPhone / Apple Watch 네이티브 앱이 오프라인 다운로드와 재생 진행률을 동기화합니다. Kobo / KOReader / BookOrbit 간 3방향 진행률 및 하이라이트 양방향 동기화. Google Books / Open Library / Amazon / Goodreads / Audible / Audnexus / Libro.fm / iTunes / Hardcover / StoryGraph / ComicVine / RanobeDB / Aladin / Lubimyczytac 등 14개 메타데이터 제공자를 통해 편집 가능한 표지와 서지 데이터를 제공합니다. Authentik / Keycloak / Authelia의 OIDC/SSO를 네이티브로 지원하는 다중 사용자 계정과 사용자별 권한. OPDS 피드, Send-to-Kindle, Hardcover / Readwise / StoryGraph 자동 동기화, Book Dock 드롭 폴더를 통한 자동 수집까지 제공합니다. 통계, 목표, 50개 이상의 업적, Reading DNA 프로필로 독서 습관을 시각화합니다. Docker 이미지는 ghcr.io/bookorbit/bookorbit이며 라이선스는 AGPL-3.0입니다.'
    ru: 'BookOrbit — открытая self-hosted платформа для чтения от neon, объединяющая электронные книги, аудиокниги, комиксы и PDF. Встроенный браузерный ридер без дополнительных плагинов поддерживает EPUB, KEPUB, MOBI, AZW3, FB2, PDF, CBZ/CBR/CB7, M4B/MP3/M4A/OPUS/OGG/FLAC. Нативные приложения для iPhone и Apple Watch синхронизируют прогресс чтения, выделения и офлайн-загрузки. Трёхсторонняя синхронизация между Kobo, KOReader и BookOrbit обеспечивает единый прогресс и заметки. 14 провайдеров метаданных (Google Books, Open Library, Amazon, Goodreads, Audible, Audnexus, Libro.fm, iTunes, Hardcover, StoryGraph, ComicVine, RanobeDB, Aladin, Lubimyczytac) дают редактируемые обложки и библиографические данные. Многопользовательские аккаунты с гранулярными правами и нативная поддержка OIDC/SSO через Authentik, Keycloak и Authelia. OPDS-каталоги, отправка на Kindle, автосинхронизация с Hardcover/Readwise/StoryGraph и папка Book Dock для автоматического импорта дополняют возможности доставки. Статистика, цели, 50+ достижений и профиль Reading DNA визуализируют стиль чтения. Docker-образ — ghcr.io/bookorbit/bookorbit, лицензия AGPL-3.0.'
    ms: 'BookOrbit ialah platform pembacaan digital sumber terbuka kendiri-sendiri dari neon yang menyatukan ebook / audiobook / komik / PDF anda. Pembaca pelayar terbina dalam mengendalikan EPUB / KEPUB / MOBI / AZW3 / FB2 / PDF / CBZ / CBR / M4B / MP3 tanpa pemalam tambahan. Aplikasi asli iPhone dan Apple Watch menyegerakkan kemajuan bacaan, sorotan dan muat turun luar talian. Penyegerakan tiga hala antara Kobo, KOReader dan BookOrbit mengekalkan kemajuan dan anotasi merentas peranti. 14 pembekal metadata (Google Books, Open Library, Amazon, Goodreads, Audible, Audnexus, Libro.fm, iTunes, Hardcover, StoryGraph, ComicVine, RanobeDB, Aladin, Lubimyczytac) membekalkan kulit dan data bibliografi yang boleh disunting. Akaun berbilang pengguna dengan kebenaran setiap pengguna dan sokongan asli OIDC/SSO melalui Authentik, Keycloak dan Authelia. Suapan OPDS, Send-to-Kindle, penyegerakan automatik Hardcover/Readwise/StoryGraph dan folder drop Book Dock untuk import automatik melengkapkan permukaan penghantaran. Statistik, matlamat, 50+ pencapaian dan profil Reading DNA memvisualkan gaya bacaan. Imej Docker ialah ghcr.io/bookorbit/bookorbit; lesen AGPL-3.0.'
    pt-br: 'BookOrbit é uma plataforma de leitura digital open-source e auto-hospedada de neon que unifica ebooks, audiobooks, quadrinhos e PDFs. O leitor integrado no navegador processa EPUB, KEPUB, MOBI, AZW3, FB2, PDF, CBZ/CBR/CB7, M4B/MP3/M4A/OPUS/OGG/FLAC sem plugins adicionais. Os apps nativos para iPhone e Apple Watch sincronizam progresso, destaques e downloads offline. Sincronização em três vias entre Kobo, KOReader e BookOrbit mantém progresso e anotações fluindo entre dispositivos. 14 provedores de metadados (Google Books, Open Library, Amazon, Goodreads, Audible, Audnexus, Libro.fm, iTunes, Hardcover, StoryGraph, ComicVine, RanobeDB, Aladin, Lubimyczytac) fornecem capas e dados bibliográficos editáveis. Contas multi-usuário com permissões granulares e suporte nativo a OIDC/SSO via Authentik, Keycloak e Authelia. Feeds OPDS, envio para Kindle, sincronização automática com Hardcover/Readwise/StoryGraph e a pasta Book Dock para importação automática completam a entrega. Estatísticas, metas, mais de 50 conquistas e perfil Reading DNA visualizam seu estilo de leitura. Imagem Docker: ghcr.io/bookorbit/bookorbit, licença AGPL-3.0.'
