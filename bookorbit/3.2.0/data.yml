additionalProperties:
  key: bookorbit
  name: bookorbit 3.2.0
  tags:
    - Book
    - Library
    - Reader
    - Self-hosted
    - EPUB
    - Audiobook
    - Comic
    - PDF
    - KOReader
    - Kobo
    - OIDC
  shortDescZh: 自托管电子书 / 漫画 / 有声书 / PDF 库（KOReader / Kobo 双向同步 + 多用户 + OIDC/SSO）
  shortDescEn: Self-hosted library for ebooks, audiobooks, comics and PDFs (KOReader/Kobo two-way sync + multi-user + OIDC/SSO)
  description:
    zh: 'BookOrbit v3.2.0 — 上游 [bookorbit/bookorbit](https://github.com/bookorbit/bookorbit) 3.2.0 release。镜像：ghcr.io/bookorbit/bookorbit:3.2.0（多架构 linux/amd64 + linux/arm64）。本应用不捆绑数据库，需先部署本仓 pgvector/ 应用（PostgreSQL 18 + pgvector，含 uuid-ossp / pg_trgm / unaccent / vector 四个必需扩展），再填其容器名与随机账号连接。新增 iPad 大屏布局、库设置面板化、元数据一键对比合并、可分数完成度阈值、独立的电子书与有声书封面、按用户隐藏 Requests 等。'
    en: 'BookOrbit v3.2.0 — upstream [bookorbit/bookorbit](https://github.com/bookorbit/bookorbit) 3.2.0 release. Image: ghcr.io/bookorbit/bookorbit:3.2.0 (multi-arch linux/amd64 + linux/arm64). This app bundles no database: deploy the repo''s pgvector/ app first (PostgreSQL 18 + pgvector with the four required extensions uuid-ossp / pg_trgm / unaccent / vector), then enter its container name and random credentials. Adds iPad layouts, single-sheet library editor, two-pane metadata match sheet, fractional completion thresholds, independent ebook and audiobook covers, per-user Requests visibility, and more.'
  type: library
  architectures:
    - amd64
    - arm64
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://bookorbit.app
  github: https://github.com/bookorbit/bookorbit
  document: https://bookorbit.app/installation
  formFields:
    # ----------------------------------------------------------------------------
    # 镜像源（GHCR 官方多架构镜像）
    # ----------------------------------------------------------------------------
    - default: ghcr.io/bookorbit/bookorbit
      edit: true
      envKey: APP_IMAGE
      labelEn: App Image
      labelZh: 应用镜像
      label:
        en: App Image
        zh: 应用镜像
        zh-Hant: 應用映像
        ja: アプリイメージ
        ko: 앱 이미지
        ru: Образ приложения
        ms: Imej Aplikasi
        pt-br: Imagem do app
      required: true
      rule: paramImageTag
      type: text
    # ----------------------------------------------------------------------------
    # 上游版本号（GHCR tag，与上游 GitHub release tag 一致，如 3.2.0）
    # ----------------------------------------------------------------------------
    - default: 3.2.0
      edit: true
      envKey: APP_VERSION
      labelEn: App Version
      labelZh: 应用版本
      label:
        en: App Version
        zh: 应用版本
        zh-Hant: 應用版本
        ja: アプリバージョン
        ko: 앱 버전
        ru: Версия приложения
        ms: Versi Aplikasi
        pt-br: Versão do app
      required: true
      rule: paramImageTag
      type: text
    # ----------------------------------------------------------------------------
    # HTTP 端口：主机侧端口 → 容器 3000
    # ----------------------------------------------------------------------------
    - default: 48300
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 連接埠
        ja: HTTP ポート
        ko: HTTP 포트
        ru: HTTP-порт
        ms: Port HTTP
        pt-br: Porta HTTP
      required: true
      rule: paramPort
      type: number
    # ----------------------------------------------------------------------------
    # PostgreSQL 主机（必填；填 1Panel-postgresql 容器名，如 1Panel-postgresql-ZU4y）
    #   安装前请先在 1Panel 应用商店部署 1Panel-postgresql (pgvector/pgvector) 应用，
    #   并在容器详情页复制其容器名。本应用与 1Panel-postgresql 共享同一外部网络
    #   1panel-network，按容器名直连，不走端口映射。
    # ----------------------------------------------------------------------------
    - default: 1Panel-postgresql-XXXX
      edit: true
      envKey: POSTGRES_HOST
      labelEn: PostgreSQL Host
      labelZh: PostgreSQL 主机
      label:
        en: PostgreSQL host (1Panel-postgresql container name, e.g. 1Panel-postgresql-ZU4y)
        zh: PostgreSQL 主机（1Panel-postgresql 容器名，如 1Panel-postgresql-ZU4y）
        zh-Hant: PostgreSQL 主機（1Panel-postgresql 容器名，如 1Panel-postgresql-ZU4y）
        ja: "PostgreSQL ホスト（1Panel-postgresql コンテナ名、例: 1Panel-postgresql-ZU4y）"
        ko: "PostgreSQL 호스트 (1Panel-postgresql 컨테이너 이름, 예: 1Panel-postgresql-ZU4y)"
        ru: Хост PostgreSQL (имя контейнера 1Panel-postgresql, напр. 1Panel-postgresql-ZU4y)
        ms: Hos PostgreSQL (nama bekas 1Panel-postgresql, cth. 1Panel-postgresql-ZU4y)
        pt-br: Host PostgreSQL (nome do contêiner 1Panel-postgresql, ex. 1Panel-postgresql-ZU4y)
      required: true
      rule: paramCommon
      type: text
    # ----------------------------------------------------------------------------
    # PostgreSQL 端口（必填；外部 DB 端口；通常 5432）
    # ----------------------------------------------------------------------------
    - default: "5432"
      edit: true
      envKey: POSTGRES_PORT
      labelEn: PostgreSQL Port
      labelZh: PostgreSQL 端口
      label:
        en: PostgreSQL Port (default 5432)
        zh: PostgreSQL 端口（默认 5432）
        zh-Hant: PostgreSQL 連接埠（預設 5432）
        ja: PostgreSQL ポート（デフォルト 5432）
        ko: PostgreSQL 포트 (기본 5432)
        ru: Порт PostgreSQL (по умолчанию 5432)
        ms: Port PostgreSQL (lalai 5432)
        pt-br: Porta PostgreSQL (padrão 5432)
      required: true
      rule: paramPort
      type: number
    # ----------------------------------------------------------------------------
    # PostgreSQL 用户名（必填；填 1Panel-postgresql 生成的随机用户名，如 user_wEJsSp）
    # ----------------------------------------------------------------------------
    - default: ""
      edit: true
      envKey: POSTGRES_USER
      labelEn: PostgreSQL User
      labelZh: PostgreSQL 用户名
      label:
        en: PostgreSQL user (1Panel random user, e.g. user_wEJsSp)
        zh: PostgreSQL 用户名（1Panel 随机用户，如 user_wEJsSp）
        zh-Hant: PostgreSQL 使用者名稱（1Panel 隨機使用者，如 user_wEJsSp）
        ja: "PostgreSQL ユーザー名（1Panel ランダムユーザー、例: user_wEJsSp）"
        ko: "PostgreSQL 사용자 이름 (1Panel 임의 사용자, 예: user_wEJsSp)"
        ru: Пользователь PostgreSQL (случайный пользователь 1Panel, напр. user_wEJsSp)
        ms: Nama pengguna PostgreSQL (pengguna rawak 1Panel, cth. user_wEJsSp)
        pt-br: Usuário PostgreSQL (usuário aleatório do 1Panel, ex. user_wEJsSp)
      required: true
      rule: paramCommon
      type: text
    # ----------------------------------------------------------------------------
    # PostgreSQL 密码（必填；填 1Panel-postgresql 生成的密码；复杂度校验）
    # ----------------------------------------------------------------------------
    - default: ""
      edit: true
      envKey: POSTGRES_PASSWORD
      labelEn: PostgreSQL Password
      labelZh: PostgreSQL 密码
      label:
        en: PostgreSQL password (from 1Panel-postgresql detail page)
        zh: PostgreSQL 密码（取自 1Panel-postgresql 容器详情页）
        zh-Hant: PostgreSQL 密碼（取自 1Panel-postgresql 容器詳情頁）
        ja: PostgreSQL パスワード（1Panel-postgresql コンテナ詳細ページから）
        ko: PostgreSQL 비밀번호 (1Panel-postgresql 컨테이너 상세 페이지에서)
        ru: Пароль PostgreSQL (со страницы контейнера 1Panel-postgresql)
        ms: Kata laluan PostgreSQL (daripada halaman bekas 1Panel-postgresql)
        pt-br: Senha PostgreSQL (da página do contêiner 1Panel-postgresql)
      required: true
      rule: paramComplexity
      type: password
    # ----------------------------------------------------------------------------
    # PostgreSQL 数据库名（必填；填 1Panel-postgresql 生成的随机 DB 名，如 postgres_wEJsSp）
    #   也可以在 1Panel-postgresql 详情页用 Navicat / psql 登入后预创建：
    #     CREATE DATABASE bookorbit;
    #   然后填入此字段。BookOrbit 启动时会自动跑迁移建表。
    # ----------------------------------------------------------------------------
    - default: ""
      edit: true
      envKey: POSTGRES_DB
      labelEn: PostgreSQL Database
      labelZh: PostgreSQL 数据库名
      label:
        en: PostgreSQL database name (1Panel random, e.g. postgres_wEJsSp; or pre-create CREATE DATABASE bookorbit;)
        zh: PostgreSQL 数据库名（1Panel 随机，如 postgres_wEJsSp；或预创建 CREATE DATABASE bookorbit;）
        zh-Hant: PostgreSQL 資料庫名（1Panel 隨機，如 postgres_wEJsSp；或預建立 CREATE DATABASE bookorbit;）
        ja: "PostgreSQL データベース名（1Panel ランダム、例: postgres_wEJsSp；または事前作成 CREATE DATABASE bookorbit;）"
        ko: "PostgreSQL 데이터베이스 이름 (1Panel 임의, 예: postgres_wEJsSp; 또는 사전 생성 CREATE DATABASE bookorbit;)"
        ru: "Имя базы PostgreSQL (случайное 1Panel, напр. postgres_wEJsSp; либо предварительно CREATE DATABASE bookorbit;)"
        ms: "Nama pangkalan data PostgreSQL (1Panel rawak, cth. postgres_wEJsSp; atau pra-wujudkan CREATE DATABASE bookorbit;)"
        pt-br: "Nome do banco PostgreSQL (1Panel aleatório, ex. postgres_wEJsSp; ou pré-criar CREATE DATABASE bookorbit;)"
      required: true
      rule: paramCommon
      type: text
    # ----------------------------------------------------------------------------
    # JWT 签名密钥（必填，复杂度校验）
    # ----------------------------------------------------------------------------
    - default: ""
      edit: true
      envKey: JWT_SECRET
      labelEn: JWT Secret
      labelZh: JWT 签名密钥
      label:
        en: JWT Secret
        zh: JWT 签名密钥
        zh-Hant: JWT 簽名密鑰
        ja: JWT 署名鍵
        ko: JWT 서명 키
        ru: Секрет подписи JWT
        ms: Kunci tandatangan JWT
        pt-br: Chave de assinatura JWT
      required: true
      rule: paramComplexity
      type: password
    # ----------------------------------------------------------------------------
    # 首次安装一次性引导 Token（必填，复杂度校验；与上游 /auth/setup 配合）
    # ----------------------------------------------------------------------------
    - default: ""
      edit: true
      envKey: SETUP_BOOTSTRAP_TOKEN
      labelEn: Setup Bootstrap Token
      labelZh: 安装引导 Token
      label:
        en: Setup Bootstrap Token
        zh: 安装引导 Token
        zh-Hant: 安裝引導 Token
        ja: セットアップ Bootstrap トークン
        ko: 설치 부트스트랩 토큰
        ru: Токен первоначальной настройки
        ms: Token Bootstrap Pemasangan
        pt-br: Token de bootstrap de instalação
      required: true
      rule: paramComplexity
      type: password
    # ----------------------------------------------------------------------------
    # 外部访问 URL（必填，影响 Kobo 同步端点与邮件链接）
    # ----------------------------------------------------------------------------
    - default: http://your-server-ip:48300
      edit: true
      envKey: APP_URL
      labelEn: External App URL
      labelZh: 外部访问 URL
      label:
        en: External App URL
        zh: 外部访问 URL
        zh-Hant: 外部存取 URL
        ja: 外部アクセス URL
        ko: 외부 액세스 URL
        ru: Внешний URL приложения
        ms: URL Akses Luaran
        pt-br: URL externo do app
      required: true
      rule: paramCommon
      type: text
    # ----------------------------------------------------------------------------
    # 容器进程 UID（与宿主机挂载目录属主一致，常见 NAS 用户为 1000）
    # ----------------------------------------------------------------------------
    - default: "1000"
      edit: true
      envKey: PUID
      labelEn: Process UID
      labelZh: 容器进程 UID
      label:
        en: Process UID
        zh: 容器进程 UID
        zh-Hant: 容器行程 UID
        ja: コンテナプロセス UID
        ko: 컨테이너 프로세스 UID
        ru: UID процесса
        ms: UID Proses
        pt-br: UID do processo
      required: false
      rule: paramCommon
      type: text
    # ----------------------------------------------------------------------------
    # 容器进程 GID（与宿主机挂载目录属主一致，常见 NAS 用户为 1000）
    # ----------------------------------------------------------------------------
    - default: "1000"
      edit: true
      envKey: PGID
      labelEn: Process GID
      labelZh: 容器进程 GID
      label:
        en: Process GID
        zh: 容器进程 GID
        zh-Hant: 容器行程 GID
        ja: コンテナプロセス GID
        ko: 컨테이너 프로세스 GID
        ru: GID процесса
        ms: GID Proses
        pt-br: GID do processo
      required: false
      rule: paramCommon
      type: text
    # ----------------------------------------------------------------------------
    # Node.js 堆内存上限（MB；auto = 容器自动检测；大库可调高至 4096+）
    # ----------------------------------------------------------------------------
    - default: auto
      edit: true
      envKey: NODE_MAX_OLD_SPACE_SIZE
      labelEn: Node.js Heap (MB)
      labelZh: Node.js 堆内存 (MB)
      label:
        en: Node.js Heap (MB)
        zh: Node.js 堆内存 (MB)
        zh-Hant: Node.js 堆積記憶體 (MB)
        ja: Node.js ヒープ (MB)
        ko: Node.js 힙 메모리 (MB)
        ru: Кучная память Node.js (МБ)
        ms: Timbunan Node.js (MB)
        pt-br: Memória heap do Node.js (MB)
      required: false
      rule: paramCommon
      type: text
    # ----------------------------------------------------------------------------
    # 时区
    # ----------------------------------------------------------------------------
    - default: Asia/Shanghai
      edit: true
      envKey: TZ
      labelEn: Timezone
      labelZh: 时区
      label:
        en: Timezone
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ru: Часовой пояс
        ms: Zon waktu
        pt-br: Fuso horário
      required: false
      rule: paramCommon
      type: text
