additionalProperties:
  key: tdarr
  name: tdarr 2.91.01
  tags:
    - Local
  shortDescZh: Tdarr 媒体库自动转码 (Server + 内置 Node)
  shortDescEn: Tdarr media library auto-transcoding (Server + built-in Node)
  description:
    zh: 基于 haveagitgat/tdarr 的媒体库自动转码与健康检查调度系统。本应用以单容器方式同时运行 Tdarr Server 与内置 Node，通过 bind mount 共享宿主 HandBrakeCLI 二进制，可与本仓库 `handbrake` 应用配合，将外部 HandBrake 作为 Tdarr 转码后端。
    en: Distributed media-library transcoding & health-check scheduler based on haveagitgat/tdarr. This app runs both the Tdarr Server and a built-in Node in a single container and shares the host HandBrakeCLI binary via bind mount, so it can pair with the sibling `handbrake` app and use the external HandBrake as the Tdarr transcode backend.
  type: media
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://tdarr.io
  github: https://github.com/HaveAGitGat/Tdarr
  document: https://docs.tdarr.io
  formFields:
