      edit: true
      envKey: PANEL_APP_PORT_WEBUI
      label:
        en: WebUI Port
        zh: WebUI 端口
        zh-Hant: WebUI 連接埠
        ja: WebUI ポート
        ko: WebUI 포트
        ru: Порт WebUI
        ms: Port WebUI
        pt-br: Porta WebUI
      required: true
      type: number
      rule: paramPort
    - default: 8266
      edit: true
      envKey: PANEL_APP_PORT_SERVER
      label:
        en: Server Port
        zh: Server 端口
        zh-Hant: Server 連接埠
        ja: Server ポート
        ko: Server 포트
        ru: Порт Server
        ms: Port Server
        pt-br: Porta Server
      required: true
      type: number
      rule: paramPort
    - default: Asia/Shanghai
      edit: true
      envKey: TZ
      label:
        en: Time zone
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ru: Часовой пояс
        ms: Zon waktu
        pt-br: Fuso horário
      required: true
      type: text
    - default: 99
      edit: true
      envKey: PUID
      label:
        en: Run as UID
