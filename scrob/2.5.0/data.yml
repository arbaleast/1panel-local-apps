additionalProperties:
  key: scrob
  name: Scrob
  shortDescZh: 自托管媒体追踪（Jellyfin / Plex / Emby 同步）
  shortDescEn: Self-hosted media tracker (Jellyfin / Plex / Emby sync)
  description:
    en: Self-hosted media tracking app that syncs libraries from Jellyfin, Plex, and Emby, tracks watch history, ratings, and personal lists
    zh: 自托管媒体追踪应用，同步 Jellyfin、Plex 和 Emby 媒体库，追踪观看历史、评分和个人片单
    zh-Hant: 自託管媒體追蹤應用程式
    ja: セルフホスト型メディア追跡アプリ。Jellyfin / Plex / Emby のライブラリを同期し、視聴履歴・評価・個人リストを管理
    ko: 자체 호스팅 미디어 추적 앱. Jellyfin, Plex, Emby 라이브러리를 동기화하고 시청 기록·평가·개인 목록을 관리
    ru: Самохостинговое приложение для отслеживания медиа. Синхронизирует библиотеки Jellyfin, Plex, Emby и хранит историю просмотров, оценки, личные списки
    ms: Aplikasi penjejakan media hos sendiri yang menyegerakkan perpustakaan Jellyfin, Plex, dan Emby
    pt-br: Aplicativo de rastreamento de mídia auto-hospedado que sincroniza bibliotecas do Jellyfin, Plex, Emby
  type: tool
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://scrob.app
  github: https://github.com/ellite/scrob
  formFields:
    - default: scrob
      edit: true
      envKey: POSTGRES_USER
      labelEn: PostgreSQL Username
      labelZh: PostgreSQL 用户名
      label:
        en: PostgreSQL Username
        zh: PostgreSQL 用户名
        zh-Hant: PostgreSQL 使用者名稱
        ja: PostgreSQL ユーザー名
        ko: PostgreSQL 사용자 이름
        ru: Имя пользователя PostgreSQL
        ms: Nama pengguna PostgreSQL
        pt-br: Nome de usuário PostgreSQL
      required: false
      type: text
    - default: ""
      edit: true
      envKey: POSTGRES_PASSWORD
      labelEn: PostgreSQL Password
      labelZh: PostgreSQL 密码
      label:
        en: PostgreSQL Password
        zh: PostgreSQL 密码
        zh-Hant: PostgreSQL 密碼
        ja: PostgreSQL パスワード
        ko: PostgreSQL 비밀번호
        ru: Пароль PostgreSQL
        ms: Kata laluan PostgreSQL
        pt-br: Senha PostgreSQL
      required: true
      type: password
    - default: scrob
      edit: true
      envKey: POSTGRES_DB
      labelEn: PostgreSQL Database
      labelZh: PostgreSQL 数据库名
      label:
        en: PostgreSQL Database
        zh: PostgreSQL 数据库名
        zh-Hant: PostgreSQL 資料庫名
        ja: PostgreSQL データベース名
        ko: PostgreSQL 데이터베이스 이름
        ru: Имя базы данных PostgreSQL
        ms: Nama pangkalan data PostgreSQL
        pt-br: Nome do banco de dados PostgreSQL
      required: false
      type: text
    - default: ""
      edit: true
      envKey: SECRET_KEY
      labelEn: Application Secret Key
      labelZh: 应用密钥
      label:
        en: Application Secret Key
        zh: 应用密钥
        zh-Hant: 應用密鑰
        ja: アプリケーションシークレットキー
        ko: 애플리케이션 시크릿 키
        ru: Секретный ключ приложения
        ms: Kunci rahsia aplikasi
        pt-br: Chave secreta do aplicativo
      required: true
      type: password
    - default: UTC
      edit: true
      envKey: TZ
      labelEn: Timezone
      labelZh: 时区
      label:
        en: Timezone
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ru: Часовой пояс
        ms: Zon waktu
        pt-br: Fuso horário
      required: false
      type: text
    - default: "false"
      edit: true
      envKey: ENABLE_REGISTRATIONS
      labelEn: Allow New User Registrations
      labelZh: 允许新用户注册
      label:
        en: Allow New User Registrations
        zh: 允许新用户注册
        zh-Hant: 允許新使用者註冊
        ja: 新規ユーザー登録を許可
        ko: 새 사용자 등록 허용
        ru: Разрешить регистрацию новых пользователей
        ms: Benarkan pendaftaran pengguna baharu
        pt-br: Permitir novos cadastros de usuários
      required: false
      type: select
      values:
        - label: 启用
          value: "true"
        - label: 禁用
          value: "false"
    - default: "0"
      edit: true
      envKey: REGISTRATION_MAX_ALLOWED_USERS
      labelEn: Max Users (0=unlimited)
      labelZh: 最大用户数 (0=无限)
      label:
        en: Max Users (0=unlimited)
        zh: 最大用户数 (0=无限)
        zh-Hant: 最大使用者數 (0=無限)
        ja: 最大ユーザー数 (0=無制限)
        ko: 최대 사용자 수 (0=무제한)
        ru: Максимум пользователей (0=без лимита)
        ms: Bilangan pengguna maksimum (0=tidak terhad)
        pt-br: Máximo de usuários (0=ilimitado)
      required: false
      type: number
