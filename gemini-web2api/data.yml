additionalProperties:
  key: gemini-web2api
  name: Gemini Web2API
  type: tool
  tags:
    - AI
    - LLM
    - API
    - Gemini
    - Proxy
  shortDescZh: Gemini 网页端反代为 OpenAI 兼容 API（无需 Google API Key）
  shortDescEn: Turns the Gemini web app into an OpenAI-compatible API without a Google API key
  description:
    zh: "gemini-web2api-go 把 Gemini 网页端（gemini.google.com）逆向反代为 OpenAI 兼容 API：同一端口提供 /v1/chat/completions、/v1/models、Gemini 原生 /v1beta 与 MCP 工具，不需要 Google API Key，也不消耗付费配额。单 Go 二进制、Chrome TLS 真指纹、Cookie 池（可多人多账号）与代理池、SQLite / MySQL / PostgreSQL 存储，自带中文管理面板（首次启动自动生成 API key）。模型跟随网页端，登录态账号可用 3.1 Pro 等需要登录的模型，额外提供图片 / 音乐 / Canvas / 视频生成接口。许可证：MIT。"
    en: "gemini-web2api-go reverse-engineers the Gemini web app (gemini.google.com) into an OpenAI-compatible API. One port serves /v1/chat/completions, /v1/models, the native Gemini /v1beta surface and MCP tools — no Google API key and no paid quota. It ships as a single Go binary with a real Chrome TLS fingerprint, a cookie pool (multiple accounts) and a proxy pool, SQLite / MySQL / PostgreSQL storage, and a built-in admin panel that generates the API key on first start. Models track the web app, so logged-in cookies unlock the login-only models such as 3.1 Pro; image, music, Canvas and video generation endpoints are included. License — MIT."
    zh-Hant: "gemini-web2api-go 把 Gemini 網頁端（gemini.google.com）逆向反代為 OpenAI 相容 API：同一埠提供 /v1/chat/completions、/v1/models、Gemini 原生 /v1beta 與 MCP 工具，不需要 Google API Key，也不消耗付費配額。單一 Go 二進位檔、Chrome TLS 真指紋、Cookie 池（多帳號）與代理池、SQLite / MySQL / PostgreSQL 儲存，內建中文管理面板（首次啟動自動產生 API key）。模型跟隨網頁端，登入態帳號可用 3.1 Pro 等需要登入的模型，另提供圖片 / 音樂 / Canvas / 影片生成介面。授權條款：MIT。"
    ja: "gemini-web2api-go は Gemini の Web アプリ（gemini.google.com）を OpenAI 互換 API にリバースエンジニアリングしたプロキシです。同一ポートで /v1/chat/completions、/v1/models、Gemini ネイティブの /v1beta、MCP ツールを提供し、Google API キーも有料クォータも不要です。単一の Go バイナリで、Chrome の実 TLS フィンガープリント、Cookie プール（複数アカウント）、プロキシプール、SQLite / MySQL / PostgreSQL 保存、初回起動時に API キーを自動生成する管理パネルを備えます。モデルは Web アプリに追随し、ログイン済み Cookie があれば 3.1 Pro などログイン限定モデルも利用できます。画像・音楽・Canvas・動画生成のエンドポイントも含みます。ライセンス：MIT。"
    ko: "gemini-web2api-go는 Gemini 웹 앱(gemini.google.com)을 OpenAI 호환 API로 역공학한 프록시입니다. 한 포트에서 /v1/chat/completions, /v1/models, Gemini 네이티브 /v1beta, MCP 도구를 제공하며 Google API 키와 유료 할당량이 필요 없습니다. 단일 Go 바이너리로 Chrome 실제 TLS 지문, 쿠키 풀(다중 계정), 프록시 풀, SQLite / MySQL / PostgreSQL 저장, 첫 실행 시 API 키를 자동 생성하는 관리 패널을 제공합니다. 모델은 웹 앱을 따르며 로그인 쿠키가 있으면 3.1 Pro 같은 로그인 전용 모델도 사용할 수 있습니다. 이미지·음악·Canvas·동영상 생성 엔드포인트도 포함합니다. 라이선스: MIT."
    ru: "gemini-web2api-go — это прокси, который реверс-инжинирит веб-приложение Gemini (gemini.google.com) в OpenAI-совместимый API. Один порт отдаёт /v1/chat/completions, /v1/models, нативный /v1beta Gemini и MCP-инструменты — без ключа Google API и без платной квоты. Поставляется одним бинарником Go с реальным TLS-отпечатком Chrome, пулом cookie (несколько аккаунтов) и пулом прокси, хранилищем SQLite / MySQL / PostgreSQL и встроенной панелью администратора, которая создаёт API key при первом запуске. Модели следуют за веб-приложением, поэтому с cookie авторизованного аккаунта доступны модели только для входа, например 3.1 Pro; также есть эндпоинты генерации изображений, музыки, Canvas и видео. Лицензия — MIT."
    ms: "gemini-web2api-go ialah proksi yang mengundurkan kejuruteraan aplikasi web Gemini (gemini.google.com) menjadi API serasi OpenAI. Satu port menyediakan /v1/chat/completions, /v1/models, /v1beta asli Gemini dan alat MCP — tanpa kunci Google API dan tanpa kuota berbayar. Ia dihantar sebagai satu binari Go dengan cap jari TLS Chrome sebenar, kolam cookie (berbilang akaun) dan kolam proksi, storan SQLite / MySQL / PostgreSQL, serta panel pentadbir terbina dalam yang menjana API key pada permulaan pertama. Model mengikut aplikasi web, jadi cookie akaun yang log masuk membuka model khusus log masuk seperti 3.1 Pro; endpoint penjanaan imej, muzik, Canvas dan video turut disertakan. Lesen — MIT."
    pt-br: "gemini-web2api-go é um proxy que engenharia reversa o app web do Gemini (gemini.google.com) em uma API compatível com OpenAI. Uma única porta serve /v1/chat/completions, /v1/models, a superfície nativa /v1beta do Gemini e ferramentas MCP — sem chave da API do Google e sem cota paga. É distribuído como um único binário Go, com impressão digital TLS real do Chrome, pool de cookies (várias contas) e pool de proxies, armazenamento SQLite / MySQL / PostgreSQL e um painel administrativo integrado que gera a API key na primeira inicialização. Os modelos acompanham o app web, então cookies de conta logada liberam os modelos exclusivos de login, como o 3.1 Pro; endpoints de geração de imagem, música, Canvas e vídeo também estão incluídos. Licença — MIT."
  website: https://github.com/zexadev/gemini-web2api-go
  github: https://github.com/zexadev/gemini-web2api-go
