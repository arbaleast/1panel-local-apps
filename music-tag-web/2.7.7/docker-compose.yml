networks:
  1panel-network:
    external: true
services:
  # Music Tag Web 主应用(变量型镜像,不在 auto-update 范围)
  music-tag-web:
    container_name: ${CONTAINER_NAME}
    image: ${IMAGE}:${APP_VERSION}
    restart: always
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
    ports:
      - "${PANEL_APP_PORT_HTTP}:8002"
    environment:
      # 启用外部 MySQL 开关(留空/false 走内置 SQLite)
      ENABLE_MYSQL: ${ENABLE_MYSQL}
      # MySQL 连接信息(仅在 ENABLE_MYSQL=true 时生效)
      MYSQL_HOST: ${MYSQL_HOST}
      MYSQL_PORT: ${MYSQL_PORT}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DB_NAME: ${MYSQL_DB_NAME}
      # 后台 Celery worker 并发数
      WORKER_NUM: ${WORKER_NUM}
    volumes:
      # 音乐库根目录(必填,可读写)
      - ./media:/app/media
      # 应用配置 + SQLite/缓存/日志(必填)
      - ./data:/app/data
      # 后台监控下载目录(可选,启用监控时挂载)
      - ./download:/app/download
