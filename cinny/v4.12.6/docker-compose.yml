networks:
  1panel-network:
    external: true

# Cinny v4.12.6 — 官方 ghcr.io 镜像，nginx 静态服务
# 镜像源：ghcr.io/cinnyapp/cinny:v4.12.6（linux/amd64 + linux/arm64 双架构）
# 容器内：nginx:1.31.5-alpine 监听 :80，服务 /app/ 下 dist/ 静态资源
# 自托管文档：https://github.com/cinnyapp/cinny#self-hosting
#
# 关于自定义默认 homeserver：Cinny 的 default_hs / explore pages 在 build 阶段
# 写入 dist/config.json，镜像内无运行时环境变量覆盖入口，1Panel schema 也不允许
# compose 出现空 volumes 块。本仓库选择最简方案：使用镜像内置默认
# （登录页默认显示 matrix.org）。如需自定义默认 homeserver：
#   1) 在外部反代（如 1Panel OpenResty / Traefik）中重写 /config.json
#   2) 或 fork 仓库自行 rebuild 镜像
# 详见 cinny/README.md "配置" 章节。

services:
  cinny:
    container_name: ${CONTAINER_NAME}
    image: ${IMAGE}:${APP_VERSION}
    restart: always
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
    ports:
      - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:80
    # 持久化占位：挂载一个 host 端空目录到容器内一个不影响功能的路径，
    # 让 1Panel schema 校验通过（其要求 volumes 必须是非空 array）。
    # /app/.local-share 在镜像内不存在，bind mount 不会覆盖任何业务文件。
    volumes:
      - ./data:/app/.local-share
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
