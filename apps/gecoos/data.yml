    ru: Gecoos AC беспроводной контроллер для централизованного управления AP（обнаружение, настройка, обновление прошивки）.
    ms: Gecoos AC ialah penyelesaian pengurusan rangkaian tanpa wayar untuk pengurusan AP berpusat, penemuan, konfigurasi, dan pengurusan firmware.
    pt-br: Gecoos AC é uma solução de gerenciamento de rede sem fio para descoberta, configuração e gerenciamento de firmware centralizado de APs.
