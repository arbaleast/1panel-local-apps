name: gecoos
title: Gecoos 集客 AC 无线控制器
description:
  zh: 集客 AC 无线控制器，实现对 AP 的集中管理，支持发现、配置、固件升级等功能。
  en: Gecoos AC wireless controller for centralized AP management, supporting discovery, configuration, and firmware upgrades.
  ja: 集客 AC 無線コントローラー。AP の集中管理、発見、構成、ファームウェア更新等功能を提供。
  ko: 集客 AC 무선 컨트롤러. AP의 집중 관리, 발견, 구성, 펌웨어 업데이트等功能 지원.
  ru: Gecoos AC беспроводной контроллер для централизованного управления AP.
  ms: Gecoos AC untuk pengurusan AP berpusat, penemuan, konfigurasi, dan pengurusan firmware.
  pt-br: Gecoos AC para gerenciamento centralizado de APs, descobrimento, configuração e atualização de firmware.
  zh-Hant: 集客 AC 無線控制器，實現對 AP 的集中管理，支援發現、配置、韌體升級等功能。
