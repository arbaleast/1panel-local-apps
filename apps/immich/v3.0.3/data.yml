additionalProperties:
  key: immich
  name: immich
  tags:
  - Local
  shortDescZh: Immich 自托管照片视频管理
  shortDescEn: Immich self-hosted photo & video manager
  description:
    zh: Google Photos 替代品，ML 人脸识别，移动端原生体验。
    en: Google Photos 替代品，ML 人脸识别，移动端原生体验。
  type: photo
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://immich.app/
  github: https://github.com/immich-app/immich
  document: https://docs.immich.app/
  formFields:
  - default: v3.0.3
    edit: true
    envKey: APP_VERSION
    labelEn: App Version
    labelZh: 版本
    required: true
    rule: paramSelect
    type: select
    values:
    - label: v3.0.3
      value: v3.0.3
    - label: v3.0.1
      value: v3.0.1
  - default: 2283
    edit: true
    envKey: PANEL_APP_PORT_HTTP
    labelEn: Web Port
    labelZh: Web 端口
    required: true
    rule: paramPort
    type: number
  - default: Asia/Shanghai
    edit: true
    envKey: TZ
    labelEn: Time Zone
    labelZh: 时区
    required: false
    type: text
  - default: /mnt/nfs/media/photos/immich/upload
    edit: true
    envKey: UPLOAD_PATH
    labelEn: Upload Storage (host path)
    labelZh: 上传文件存储路径（宿主机）
    required: true
    rule: paramPath
    type: text
  - default: ./data/model-cache
    edit: true
    envKey: MODEL_CACHE_PATH
    labelEn: Model Cache (host path)
    labelZh: 模型缓存目录（宿主机）
    required: true
    rule: paramPath
    type: text
  - default: 1Panel-postgresql-ZU4y
    edit: true
    envKey: DB_HOSTNAME
    labelEn: Postgres Host
    labelZh: 数据库服务名
    label:
      en: Postgres Host (1Panel container name)
      zh: 数据库服务名 (1Panel 容器名)
    required: true
    rule: paramCommon
    type: text
  - default: user_wEJsSp
    edit: true
    envKey: DB_USERNAME
    labelEn: Database User
    labelZh: 数据库用户名
    required: true
    rule: paramCommon
    type: text
  - default: password_tyrcEJ
    edit: true
    envKey: DB_PASSWORD
    labelEn: Database Password
    labelZh: 数据库密码
    required: true
    rule: paramCommon
    type: password
  - default: immich
    edit: true
    envKey: DB_NAME
    labelEn: Database Name
    labelZh: 数据库名称
    required: true
    rule: paramCommon
    type: text
  - default: 1Panel-redis-wd53
    edit: true
    envKey: REDIS_HOSTNAME
    labelEn: Redis Host
    labelZh: Redis 服务名
    label:
      en: Redis Host (1Panel container name)
      zh: Redis 服务名 (1Panel 容器名)
    required: true
    rule: paramCommon
    type: text
  - default: "1panel123"
    edit: true
    envKey: REDIS_PASSWORD
    labelEn: Redis Password
    labelZh: Redis 密码
    label:
      en: Redis Password
      zh: Redis 密码
    required: true
    rule: paramCommon
    type: text
  - default: "2"
    edit: true
    envKey: TRANSFORMATIONS_MAX_CONCURRENCY
    labelEn: Image Transform Thread Pool
    labelZh: 图片转换线程池
    required: false
    rule: paramInt
    type: number
  - default: chi_sim+eng
    edit: true
    envKey: OCR_LANGUAGES
    labelEn: OCR Languages
    labelZh: OCR 语言
    required: false
    type: text
  - default: "512"
    edit: true
    envKey: MAX_CACHE_SIZE
    labelEn: Thumbnail Cache (MB)
    labelZh: 缩略图缓存上限（MB）
    required: false
    rule: paramInt
    type: number
  - default: "2"
    edit: true
    envKey: IMMICH_WORKER_THREADS
    labelEn: Worker Threads
    labelZh: 并行任务线程数
    required: false
    rule: paramInt
    type: number
  - default: "1"
    edit: true
    envKey: ML_WORKERS
    labelEn: ML Worker Processes
    labelZh: ML Worker 进程数
    required: false
    rule: paramInt
    type: number
  - default: int8
    edit: true
    envKey: ML_MODEL_PRECISION
    labelEn: ML Model Precision
    labelZh: ML 模型精度
    required: false
    rule: paramSelect
    type: select
    values:
    - label: int8（省 CPU，推荐）
      value: int8
    - label: fp16（平衡）
      value: fp16
    - label: fp32（高精度）
      value: fp32
