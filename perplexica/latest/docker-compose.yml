networks:
  1panel-network:
    external: true
services:
  perplexica:
    container_name: ${CONTAINER_NAME}
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    environment:
    - PORT=3000
    - AI_PROVIDER=${AI_PROVIDER}
    - AI_MODEL=${AI_MODEL}
    - API_KEY=${API_KEY}
    - API_URL=${API_URL}
    - SIMILARITY_THRESHOLD=${SIMILARITY_THRESHOLD}
    image: itzcrazykns1337/vane:latest
    labels:
      createdBy: Apps
    networks:
    - 1panel-network
    ports:
    - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:3000
    restart: always
    volumes:
    - ./data:/app/server/lib/db
