networks:
  1panel-network:
    external: true
services:
  aria2:
    container_name: ${CONTAINER_NAME}
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - SECRET=${SECRET}
      - CACHE=${CACHE}
      - QUIET=${QUIET}
      - PORT=6800
      - WEBUI=${WEBUI}
      - WEBUI_PORT=8080
      - BTPORT=32516
      - UT=true
      - SMD=true
    image: superng6/aria2:latest
    labels:
      createdBy: Apps
    networks:
      1panel-network:
        aliases:
          - ${CONTAINER_NAME}
    ports:
      - "${PANEL_APP_PORT_RPC}:6800"
      - "${PANEL_APP_PORT_WEBUI}:8080"
      - "${PANEL_APP_PORT_BT}:32516"
      - "${PANEL_APP_PORT_BT}:32516/udp"
    restart: always
    volumes:
      - ${CONFIG_PATH}:/config
      - ${DOWNLOADS_PATH}:/downloads