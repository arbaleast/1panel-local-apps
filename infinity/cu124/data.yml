additionalProperties:
  formFields:
  # 本地构建镜像 tag：infinity-pascal:cu124（源码委派将提供完整 Dockerfile）
  - default: infinity-pascal:cu124
    edit: true
    envKey: IMAGE
    labelEn: Docker Image
    labelZh: Docker 镜像
    label:
      en: Docker Image
      zh: Docker 镜像
      zh-Hant: Docker 鏡像
      ja: Docker イメージ
      ko: Docker 이미지
      ru: Docker образ
      ms: Imej Docker
      pt-br: Imagem Docker
    required: true
    type: text
    rule: paramImageTag
  # HuggingFace 模型 repo id，支持预设：bge-large-zh / bge-m3 / qwen3-emb-0.6b 或自定义
  - default: BAAI/bge-large-zh-v1.5
    edit: true
    envKey: EMBEDDING_MODEL
    labelEn: Embedding Model (presets：bge-large-zh / bge-m3 / qwen3-emb-0.6b or custom HF repo id)
    labelZh: 嵌入模型（支持预设：bge-large-zh / bge-m3 / qwen3-emb-0.6b 或自定义 HF repo id）
    label:
      en: Embedding Model (presets：bge-large-zh / bge-m3 / qwen3-emb-0.6b or custom HF repo id)
      zh: 嵌入模型（支持预设：bge-large-zh / bge-m3 / qwen3-emb-0.6b 或自定义 HF repo id）
      zh-Hant: 嵌入模型（支援預設：bge-large-zh / bge-m3 / qwen3-emb-0.6b 或自訂 HF repo id）
      ja: 埋め込みモデル（プリセット：bge-large-zh / bge-m3 / qwen3-emb-0.6b またはカスタム HF リポジトリ ID）
      ko: 임베딩 모델 (사전 설정：bge-large-zh / bge-m3 / qwen3-emb-0.6b 또는 사용자 지정 HF repo id)
      ru: Модель эмбеддингов (пресеты：bge-large-zh / bge-m3 / qwen3-emb-0.6b или свой repo id на HuggingFace)
      ms: Model embedding (praset：bge-large-zh / bge-m3 / qwen3-emb-0.6b atau repo id HF tersuai)
      pt-br: Modelo de embeddings (predefinições：bge-large-zh / bge-m3 / qwen3-emb-0.6b ou repo id HF personalizado)
    required: true
    type: text
    rule: paramCommon
  # 模型精度：float16 / int8 / bfloat16 / auto
  - default: int8
    edit: true
    envKey: DTYPE
    labelEn: Model Precision (dtype)
    labelZh: 模型精度
    label:
      en: Model Precision (dtype)
      zh: 模型精度
      zh-Hant: 模型精度
      ja: モデル精度 (dtype)
      ko: 모델 정밀도 (dtype)
      ru: Точность модели (dtype)
      ms: Ketepatan model (dtype)
      pt-br: Precisão do modelo (dtype)
    required: true
    type: select
    rule: paramSelect
    values:
    - label: float16
      value: float16
    - label: int8
      value: int8
    - label: bfloat16
      value: bfloat16
    - label: auto
      value: auto
  # 推理批大小
  - default: '32'
    edit: true
    envKey: BATCH_SIZE
    labelEn: Batch Size
    labelZh: 推理批大小
    label:
      en: Batch Size
      zh: 推理批大小
      zh-Hant: 推論批次大小
      ja: バッチサイズ
      ko: 배치 크기
      ru: Размер батча
      ms: Saiz kelompok
      pt-br: Tamanho do lote
    required: false
    type: number
    rule: paramCommon
  # GPU 设备 ID，支持逗号分隔多卡，例如 0,1
  - default: '0'
    edit: true
    envKey: NVIDIA_VISIBLE_DEVICES
    labelEn: GPU Device IDs (e.g. 0 or 0,1)
    labelZh: GPU 设备 ID（如 0 或 0,1）
    label:
      en: GPU Device IDs (e.g. 0 or 0,1)
      zh: GPU 设备 ID（如 0 或 0,1）
      zh-Hant: GPU 設備 ID（如 0 或 0,1）
      ja: GPU デバイス ID（例：0、0,1）
      ko: GPU 장치 ID (예：0, 0,1)
      ru: ID GPU-устройств (например 0, 0,1)
      ms: ID peranti GPU (cth. 0, 0,1)
      pt-br: IDs de dispositivos GPU (ex.：0, 0,1)
    required: false
    type: text
    rule: paramCommon
  # 宿主机对外 API 端口
  - default: '7997'
    edit: true
    envKey: PANEL_APP_PORT_HTTP
    labelEn: Host API Port
    labelZh: 宿主机 API 端口
    label:
      en: Host API Port
      zh: 宿主机 API 端口
      zh-Hant: 主機 API 連接埠
      ja: ホスト側 API ポート
      ko: 호스트 API 포트
      ru: Порт API на хосте
      ms: Port API hos
      pt-br: Porta da API no host
    required: true
    type: number
    rule: paramPort
  # 容器内 API 端口（内部固定，不建议修改）
  - default: '7997'
    edit: false
    envKey: INFINITY_PORT
    labelEn: Container API Port
    labelZh: 容器内 API 端口
    label:
      en: Container API Port
      zh: 容器内 API 端口
      zh-Hant: 容器內 API 連接埠
      ja: コンテナ内 API ポート
      ko: 컨테이너 내 API 포트
      ru: Порт API в контейнере
      ms: Port API dalam bekas
      pt-br: Porta da API no contêiner
    required: false
    type: number
    rule: paramCommon
    hidden: true