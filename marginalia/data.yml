additionalProperties:
  key: marginalia
  name: Marginalia
  tags:
    - AI
    - Knowledge Base
    - LLM
  shortDescZh: 本地优先的私人知识库 + LLM 研究代理
  shortDescEn: Local-first personal knowledge base with LLM research agent
  description:
    zh: Marginalia 是一个本地优先的私人知识库系统，集成了 LLM 研究代理能力。基于 FastAPI + PostgreSQL + MinIO 构建，支持 PDF、笔记、表格等多种异构资料摄入，可对本地资料库进行语义检索并产出带引用的回答。许可证：AGPL-3.0。
    en: Marginalia is a local-first personal knowledge management system with LLM research agent capabilities. Built on FastAPI, PostgreSQL, and MinIO, it ingests heterogeneous sources (PDFs, notes, spreadsheets, archives) and produces citation-grounded answers via semantic recall. License: AGPL-3.0.
    zh-Hant: Marginalia 是一個本地優先的私人知識庫系統，整合了 LLM 研究代理能力。基於 FastAPI + PostgreSQL + MinIO 建構，支援 PDF、筆記、表格等多種異質資料攝入，可對本地資料庫進行語意檢索並產出帶引用的回答。授權條款：AGPL-3.0。
    ja: Marginaliaは、ローカルファーストの個人用ナレッジベースシステムで、LLM研究エージェント機能を統合しています。FastAPI + PostgreSQL + MinIOで構築され、PDF、メモ、表計算など多様な異種ソースを取り込み、セマンティック検索により引用付きの回答を生成します。ライセンス：AGPL-3.0。
    ko: Marginalia는 로컬 우선의 개인 지식 베이스 시스템으로 LLM 연구 에이전트 기능을 통합했습니다. FastAPI + PostgreSQL + MinIO 기반으로 구축되며 PDF, 메모, 스프레드시트 등 다양한 이기종 소스를 수집하고 시맨틱 검색을 통해 인용이 포함된 답변을 생성합니다. 라이선스: AGPL-3.0.
    ru: Marginalia — локально-приоритетная персональная система управления знаниями с возможностями LLM-агента. Построена на FastAPI, PostgreSQL и MinIO, принимает разнородные источники (PDF, заметки, таблицы) и выдаёт ответы со ссылками через семантический поиск. Лицензия: AGPL-3.0.
    ms: Marginalia ialah sistem pengurusan pengetahuan peribadi yang mengutamakan tempatan dengan keupayaan ejen penyelidikan LLM. Dibina pada FastAPI, PostgreSQL, dan MinIO, ia menyokong ingesti sumber heterogen (PDF, nota, hamparan) dan menjana jawapan dengan petikan melalui carian semantik. Lesen: AGPL-3.0.
    pt-br: Marginalia é um sistema pessoal de gestão de conhecimento local-first com recursos de agente de pesquisa LLM. Construído em FastAPI, PostgreSQL e MinIO, ingere fontes heterogêneas (PDFs, notas, planilhas) e produz respostas fundamentadas com citações via busca semântica. Licença: AGPL-3.0.
