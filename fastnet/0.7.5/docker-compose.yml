networks:
  1panel-network:
    external: true
services:
  fastnet:
    container_name: ${CONTAINER_NAME}
    # 以指定 UID/GID 运行（宿主机挂载目录需 chown 到同一属主，否则容器内无法写入）
    user: "${UID}:${GID}"
    image: linkease/fastnet:0.7.5
    labels:
      createdBy: Apps
    networks:
    - 1panel-network
    ports:
    - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:3200
    restart: always
    environment:
    - TZ=${TZ}
    - FASTNET_TOKEN=${FASTNET_TOKEN}
