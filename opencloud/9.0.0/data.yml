additionalProperties:
  key: opencloud
  name: OpenCloud
  type: tool
  formFields:
    - default: 9200
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 連接埠
        ja: HTTP ポート
        ko: HTTP 포트
        ru: HTTP-порт
        ms: Port HTTP
        pt-br: Porta HTTP
        es-es: Puerto HTTP
        tr: HTTP bağlantı noktası
      required: true
      rule: paramPort
      type: number
    - default: https://localhost:9200
      edit: true
      envKey: OC_URL
      labelEn: Public URL
      labelZh: 外部访问地址
      label:
        en: Public URL
        zh: 外部访问地址
        zh-Hant: 外部存取網址
        ja: 公開 URL
        ko: 공개 URL
        ru: Публичный URL
        ms: URL awam
        pt-br: URL público
        es-es: URL pública
        tr: Genel URL
      required: true
      type: text
    - default: "true"
      edit: true
      envKey: PROXY_TLS
      labelEn: Container HTTPS
      labelZh: 容器 HTTPS
      label:
        en: Container HTTPS
        zh: 容器 HTTPS
        zh-Hant: 容器 HTTPS
        ja: コンテナ HTTPS
        ko: 컨테이너 HTTPS
        ru: HTTPS в контейнере
        ms: HTTPS dalam kontena
        pt-br: HTTPS no contêiner
        es-es: HTTPS en el contenedor
        tr: Konteyner HTTPS
      required: true
      rule: paramSelect
      type: select
      values:
        - label: "true"
          value: "true"
        - label: "false"
          value: "false"
    - default: opencloud-admin
      edit: true
      envKey: ADMIN_PASSWORD
      labelEn: Admin Password
      labelZh: 管理员密码
      label:
        en: Admin Password
        zh: 管理员密码
        zh-Hant: 管理員密碼
        ja: 管理者パスワード
        ko: 관리자 비밀번호
        ru: Пароль администратора
        ms: Kata laluan pentadbir
        pt-br: Senha do admin
        es-es: Contraseña de administración
        tr: Yönetici parolası
      random: true
      required: true
      rule: paramComplexity
      type: password
    - default: 1000
      edit: true
      envKey: UID
      labelEn: Run as UID
      labelZh: 运行用户 UID
      label:
        en: Run as UID
        zh: 运行用户 UID
        zh-Hant: 執行使用者 UID
        ja: 実行 UID
        ko: 실행 UID
        ru: UID пользователя
        ms: UID pengguna
        pt-br: UID do usuário
        es-es: UID del usuario
        tr: Çalıştırma UID
      required: true
      type: number
    - default: 1000
      edit: true
      envKey: GID
      labelEn: Run as GID
      labelZh: 运行用户 GID
      label:
        en: Run as GID
        zh: 运行用户 GID
        zh-Hant: 執行使用者 GID
        ja: 実行 GID
        ko: 실행 GID
        ru: GID пользователя
        ms: GID pengguna
        pt-br: GID do usuário
        es-es: GID del usuario
        tr: Çalıştırma GID
      required: true
      type: number
    - default: info
      edit: true
      envKey: LOG_LEVEL
      labelEn: Log Level
      labelZh: 日志级别
      label:
        en: Log Level
        zh: 日志级别
        zh-Hant: 日誌等級
        ja: ログレベル
        ko: 로그 수준
        ru: Уровень журнала
        ms: Tahap log
        pt-br: Nível de log
        es-es: Nivel de registro
        tr: Günlük düzeyi
      required: true
      rule: paramSelect
      type: select
      values:
        - label: error
          value: error
        - label: warn
          value: warn
        - label: info
          value: info
        - label: debug
          value: debug
    - default: Asia/Shanghai
      edit: true
      envKey: TZ
      labelEn: Timezone
      labelZh: 时区
      label:
        en: Timezone
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ru: Часовой пояс
        ms: Zon waktu
        pt-br: Fuso horário
        es-es: Zona horaria
        tr: Saat dilimi
      required: true
      type: text
