# LinguaFlow Docker Compose
# 镜像源：ghcr.io/meowsalty/linguaflow:0.17.1（上游官方 GHCR 镜像）
#         多架构：linux/amd64 + linux/arm64 + linux/arm/v7
# 官方仓库：https://github.com/MeowSalty/LinguaFlow
# 官方文档：https://meowsalty.github.io/LinguaFlow/zh/guide/installation.html
#
# ⚠ 容器默认执行的是**服务器模式**（linguaflow serve，容器内监听 0.0.0.0:8080），
#   与「双击二进制进入的本地模式」不是一回事。服务器模式启动前必须提供三项输入，缺一即拒绝启动：
#     1. JWT 签名密钥        -> LINGUAFLOW_JWT_SECRET        (>= 32 字节)
#     2. 凭据加密密钥        -> LINGUAFLOW_CREDENTIALS_MASTER_KEY (32 字节随机值的 Base64)
#     3. 初始管理员用户名/密码 -> LINGUAFLOW_BOOTSTRAP_ADMIN_USERNAME / _PASSWORD
#   前两项由 scripts/init.sh 首次部署时生成到 ./data/secrets/ 并**长期保留**；
#   管理员密码取自 1Panel 安装参数。三者均以 *_FILE 形式注入，避免明文出现在容器环境变量里。
#
# ⚠ 凭据加密密钥是数据库里所有 AI 密钥的解密钥匙：一旦更换或丢失，已保存的 AI 密钥无法解密。
#   备份 ./data 时必须连同密钥文件一起备份。

networks:
  1panel-network:
    external: true

services:
  linguaflow:
    container_name: ${CONTAINER_NAME}
    # 官方镜像内置非 root 用户（appuser），本应用改用 user: 指定运行身份；
    # 宿主机数据目录由 scripts/init.sh chown 到同一 UID/GID，否则容器写不进 SQLite。
    user: "${UID}:${GID}"
    image: ghcr.io/meowsalty/linguaflow:0.17.1
    restart: always
    networks:
      - 1panel-network
    labels:
      createdBy: "Apps"
    # 官方镜像的 WORKDIR 是 /app（属主 root，非 root 身份写不进去），
    # 这里把工作目录指向可写的数据目录，避免任何相对路径写入失败。
    working_dir: /app/data
    environment:
      - TZ=${TZ}
      # 数据目录（SQLite 库 / 缓存 / 临时目录 / 密钥文件）
      - LINGUAFLOW_DATA_DIR=/app/data
      # 服务器模式监听地址与端口（上游 serve 默认 0.0.0.0:8080）
      - LINGUAFLOW_HOST=0.0.0.0
      - LINGUAFLOW_PORT=8080
      # 敏感值走 *_FILE 注入（上游支持 _FILE 后缀，同一变量的直接值与 _FILE 形式不能同时给）
      - LINGUAFLOW_JWT_SECRET_FILE=/app/data/secrets/jwt-secret
      - LINGUAFLOW_CREDENTIALS_MASTER_KEY_FILE=/app/data/secrets/credentials-master-key
      - LINGUAFLOW_BOOTSTRAP_ADMIN_PASSWORD_FILE=/app/data/secrets/bootstrap-admin-password
      # 初始管理员用户名（仅首次初始化生效）
      - LINGUAFLOW_BOOTSTRAP_ADMIN_USERNAME=${LINGUAFLOW_BOOTSTRAP_ADMIN_USERNAME}
      # 首次初始化时是否开放注册（初始化后可在管理端调整）
      - LINGUAFLOW_BOOTSTRAP_REGISTRATION_ENABLED=${LINGUAFLOW_BOOTSTRAP_REGISTRATION_ENABLED}
      - LINGUAFLOW_LOG_LEVEL=${LINGUAFLOW_LOG_LEVEL}
    ports:
      - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:8080
    volumes:
      # 相对路径 bind mount：SQLite 数据库、缓存、临时目录与密钥文件都在这里
      - ./data:/app/data
