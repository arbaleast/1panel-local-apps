additionalProperties:
  key: linguaflow
  name: LinguaFlow
  type: tool
  formFields:
    - default: 8080
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Port
      labelZh: HTTP 端口
      label:
        en: HTTP Port
        zh: HTTP 端口
        zh-Hant: HTTP 連接埠
        ja: HTTP ポート
        ko: HTTP 포트
        ru: HTTP-порт
        ms: Port HTTP
        pt-br: Porta HTTP
      required: true
      rule: paramPort
      type: number
    - default: Asia/Shanghai
      edit: true
      envKey: TZ
      labelEn: Timezone
      labelZh: 时区
      label:
        en: Timezone
        zh: 时区
        zh-Hant: 時區
        ja: タイムゾーン
        ko: 시간대
        ru: Часовой пояс
        ms: Zon waktu
        pt-br: Fuso horário
      required: true
      type: text
    - default: admin
      edit: true
      envKey: LINGUAFLOW_BOOTSTRAP_ADMIN_USERNAME
      labelEn: Admin Username
      labelZh: 管理员用户名
      label:
        en: Admin Username
        zh: 管理员用户名
        zh-Hant: 管理員使用者名稱
        ja: 管理者ユーザー名
        ko: 관리자 사용자 이름
        ru: Имя администратора
        ms: Nama pengguna admin
        pt-br: Nome de usuário admin
      required: true
      type: text
    - default: ""
      edit: true
      envKey: LINGUAFLOW_BOOTSTRAP_ADMIN_PASSWORD
      labelEn: Admin Password
      labelZh: 管理员密码
      label:
        en: Admin Password
        zh: 管理员密码
        zh-Hant: 管理員密碼
        ja: 管理者パスワード
        ko: 관리자 비밀번호
        ru: Пароль администратора
        ms: Kata laluan admin
        pt-br: Senha do admin
      required: true
      type: password
    - default: "false"
      edit: true
      envKey: LINGUAFLOW_BOOTSTRAP_REGISTRATION_ENABLED
      labelEn: Open Registration
      labelZh: 开放注册
      label:
        en: Open Registration
        zh: 开放注册
        zh-Hant: 開放註冊
        ja: 登録 허용
        ko: 가입 허용
        ru: Открытая регистрация
        ms: Pendaftaran terbuka
        pt-br: Registro aberto
      required: true
      rule: paramSelect
      type: select
      values:
        - label: "true"
          value: "true"
        - label: "false"
          value: "false"
    - default: info
      edit: true
      envKey: LINGUAFLOW_LOG_LEVEL
      labelEn: Log Level
      labelZh: 日志级别
      label:
        en: Log Level
        zh: 日志级别
        zh-Hant: 日誌級別
        ja: ログレベル
        ko: 로그 레벨
        ru: Уровень логирования
        ms: Tahap log
        pt-br: Nível de log
      required: true
      rule: paramSelect
      type: select
      values:
        - label: debug
          value: debug
        - label: info
          value: info
        - label: warn
          value: warn
        - label: error
          value: error
    - default: 99
      edit: true
      envKey: UID
      labelEn: Run as UID
      labelZh: 运行用户 UID
      label:
        en: Run as UID
        zh: 运行用户 UID
        zh-Hant: 執行使用者 UID
        ja: 実行 UID
        ko: 실행 UID
        ru: UID пользователя
        ms: UID pengguna
        pt-br: UID do usuário
      required: true
      type: number
    - default: 100
      edit: true
      envKey: GID
      labelEn: Run as GID
      labelZh: 运行组 GID
      label:
        en: Run as GID
        zh: 运行组 GID
        zh-Hant: 執行群組 GID
        ja: 実行 GID
        ko: 실행 GID
        ru: GID группы пользователя
        ms: GID kumpulan pengguna
        pt-br: GID do usuário
      required: true
      type: number
