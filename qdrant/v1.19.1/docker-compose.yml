networks:
  1panel-network:
    external: true
services:
  qdrant:
    container_name: ${CONTAINER_NAME}
    # 以指定 UID/GID 运行（宿主机挂载目录需 chown 到同一属主，否则容器内无法写入）
    user: "${UID}:${GID}"
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    environment:
    - TZ=${TZ}
    image: qdrant/qdrant:v1.19.1
    labels:
      createdBy: Apps
    networks:
      1panel-network:
        aliases:
        - ${CONTAINER_NAME}
    ports:
    - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:6333
    - ${HOST_IP}:${PANEL_APP_PORT_GRPC}:6334
    restart: always
    volumes:
    - ${DATA_PATH}:/qdrant/storage
