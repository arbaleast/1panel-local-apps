networks:
    1panel-network:
        external: true
services:
    qdrant:
        container_name: ${CONTAINER_NAME}
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        environment:
            - TZ=${TZ}
        image: qdrant/qdrant:latest
        labels:
            createdBy: Apps
        networks:
            1panel-network:
                aliases:
                    - ${CONTAINER_NAME}
        ports:
            - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:6333
            - ${HOST_IP}:${PANEL_APP_PORT_GRPC}:6334
        restart: always
        volumes:
            - ${DATA_PATH}:/qdrant/storage
