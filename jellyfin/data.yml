additionalProperties:
  key: jellyfin
  name: jellyfin
  tags:
  - Local
  shortDescZh: Jellyfin 媒体服务器
  shortDescEn: Jellyfin media server
  description:
    zh: 免费软件媒体系统，流式播放个人媒体库。
    en: 免费软件媒体系统，流式播放个人媒体库。
  type: media
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://jellyfin.org/
  github: https://github.com/jellyfin/jellyfin
  document: https://jellyfin.org/docs/
  formFields:
  - default: 8096
    edit: true
    envKey: PANEL_APP_PORT_HTTP
    labelEn: WebUI Port
    labelZh: 网页端口
    label:
      en: WebUI Port
      zh: 网页端口
      zh-Hant: 網頁埠
      ja: WebUI ポート
      ko: 웹 UI 포트
      ru: Порт веб-интерфейса
      ms: Port WebUI
      pt-br: Porta da WebUI
    required: true
    rule: paramPort
    type: number
  - default: /mnt/nfs/media
    edit: true
    envKey: MEDIA_FOLDER_PATH
    labelEn: Media folder path
    labelZh: 媒体文件夹路径
    label:
      en: Media folder path
      zh: 媒体文件夹路径
      zh-Hant: 媒體資料夾路徑
      ja: メディアフォルダーパス
      ko: 미디어 폴더 경로
      ru: Путь к папке медиа
      ms: Laluan folder media
      pt-br: Caminho da pasta de mídia
    required: true
    type: text
  - default: /dev/shm
    edit: true
    envKey: CACHE_FOLDER_PATH
    labelEn: Cache folder path
    labelZh: 缓存文件夹路径
    label:
      en: Cache folder path
      zh: 缓存文件夹路径
      zh-Hant: 快取資料夾路徑
      ja: キャッシュフォルダーパス
      ko: 캐시 폴더 경로
      ru: Путь к папке кэша
      ms: Laluan folder cache
      pt-br: Caminho da pasta de cache
    required: true
    type: text
