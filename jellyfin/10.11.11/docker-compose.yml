networks:
    1panel-network:
        external: true
services:
    jellyfin:
        container_name: ${CONTAINER_NAME}
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        devices:
            - /dev/dri:/dev/dri
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=all
        runtime: nvidia
        image: ${IMAGE}
        labels:
            createdBy: Apps
        networks:
            1panel-network:
                aliases:
                    - ${CONTAINER_NAME}
        ports:
            - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:8096
        restart: always
        volumes:
            - ./data/config:/config
            - ${CACHE_FOLDER_PATH}:/cache
            - ${MEDIA_FOLDER_PATH}:/media
            - ${FONTS_FOLDER_PATH}:/usr/share/fonts/fonts:ro
