networks:
    1panel-network:
        external: true
services:
    jellyfin:
        container_name: ${CONTAINER_NAME}
        # 以指定 UID/GID 运行（上游官方文档推荐写法）。
        # 宿主机挂载目录（config / cache / media）需对同一属主开放读写，否则 Jellyfin 启动即失败。
        user: "${UID}:${GID}"
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        devices:
            - /dev/dri:/dev/dri
        environment:
            - NVIDIA_VISIBLE_DEVICES=all
            - NVIDIA_DRIVER_CAPABILITIES=all
        runtime: nvidia
        image: ${IMAGE}
        labels:
            createdBy: Apps
        networks:
            1panel-network:
                aliases:
                    - ${CONTAINER_NAME}
        ports:
            - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:8096
        restart: always
        volumes:
            - ./data/config:/config
            - ${CACHE_FOLDER_PATH}:/cache
            - ${MEDIA_FOLDER_PATH}:/media
            # 宿主机字体只读挂载到容器 /usr/share/fonts（等价于 -v /usr/share/fonts:/usr/share/fonts:ro）。
            # 服务端「系统字体」用于烧录（burn-in）字幕与封面图渲染；宿主机没有中文字体时，字幕里的中文会显示为方块。
            # 默认值 /usr/share/fonts 直接复用宿主机已安装的字体（如 fonts-noto-cjk / fonts-wqy-zenhei）。
            - ${FONTS_FOLDER_PATH}:/usr/share/fonts:ro
