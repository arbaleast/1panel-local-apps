    # 宿主机字体目录（只读挂载到容器 /usr/share/fonts，等价于 -v /usr/share/fonts:/usr/share/fonts:ro）。
    # 服务端「系统字体」用于烧录（burn-in）字幕与封面图渲染；宿主机缺中文字体时字幕中文会显示为方块。
    # 默认 /usr/share/fonts = 复用宿主机已安装字体；也可改成任意包含字体文件的宿主机绝对路径。
    - default: /usr/share/fonts
      edit: true
      envKey: FONTS_FOLDER_PATH
      labelEn: Host fonts directory
      labelZh: 宿主机字体目录
      label:
        en: Host fonts directory
        zh: 宿主机字体目录
        zh-Hant: 主機字型目錄
        ja: ホストのフォントディレクトリ
        ko: 호스트 글꼴 디렉터리
        ru: Каталог шрифтов хоста
        ms: Direktori fon hos
        pt-br: Diretório de fontes do host
      required: false
      type: text
