networks:
  1panel-network:
    external: true
services:
  anirss:
    container_name: ${CONTAINER_NAME}
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    environment:
    - UMASK=${UMASK}
    - TZ=${TZ}
    - SERVER_PORT=${SERVER_PORT}
    - CONFIG=${CONFIG}
    - JAVA_OPTS=${JAVA_OPTS}
    - SWAGGER_ENABLED=${SWAGGER_ENABLED}
    - MCP_ENABLED=${MCP_ENABLED}
    user: ${USER_ID}:${GROUP_ID}
    image: wushuo894/ani-rss:v3.2.9-arm32v7
    labels:
      createdBy: Apps
    networks:
      1panel-network:
        aliases:
        - ${CONTAINER_NAME}
    restart: always
    tty: true
    volumes:
    - ${CONFIG_PATH}:${CONFIG}
    - ${MEDIA_PATH}:/media
