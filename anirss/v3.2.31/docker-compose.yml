networks:
  1panel-network:
    external: true
services:
  anirss:
    container_name: ${CONTAINER_NAME}
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    environment:
    - PUID=99
    - PGID=100
    - UMASK=${UMASK}
    - TZ=${TZ}
    - SERVER_PORT=${SERVER_PORT}
    - CONFIG=${CONFIG}
    - JAVA_OPTS=${JAVA_OPTS}
    - SWAGGER_ENABLED=${SWAGGER_ENABLED}
    - MCP_ENABLED=${MCP_ENABLED}
    - ANI_RSS_HOST_IP=${ANI_RSS_HOST_IP}
    - QBT_PORT=${QBT_PORT}
    image: wushuo894/ani-rss:v3.2.31
    labels:
      createdBy: Apps
    networks:
      1panel-network:
        aliases:
        - ${CONTAINER_NAME}
    ports:
      - ${PANEL_APP_PORT_HTTP}:${SERVER_PORT}
    restart: always
    tty: true
    volumes:
    - ${CONFIG_PATH}:${CONFIG}
    - ${MEDIA_PATH}:/Media
