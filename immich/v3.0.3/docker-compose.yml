networks:
    1panel-network:
        external: true
services:
    # 主服务放在前面：版本目录名 ↔ 镜像 tag 的自动校验以主服务镜像为准
    immich-server:
        container_name: ${CONTAINER_NAME}
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
                # ── NVIDIA GPU（可选，默认关闭，纯 CPU 宿主机直接装即可）────────────
                # 启用前提：宿主机已装 NVIDIA 专有驱动 + nvidia-container-toolkit。
                # 启用方式：安装时勾选「编辑 Compose 文件」，把下面 8 行取消注释后保存。
                # 生效后还需在 Immich 网页端（管理 → 设置 → 视频转码）把硬件加速选成 NVENC。
                # reservations:
                #     devices:
                #         - driver: nvidia
                #           count: 1
                #           capabilities:
                #             - gpu
                #             - compute
                #             - video
        environment:
            - TZ=${TZ}
            - DB_HOSTNAME=${DB_HOSTNAME}
            - DB_PORT=5432
            - DB_DATABASE_NAME=${DB_NAME}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOSTNAME=${REDIS_HOSTNAME}
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            # 机器学习服务地址（上游读 IMMICH_MACHINE_LEARNING_URL，默认值即此地址）
            - IMMICH_MACHINE_LEARNING_URL=http://immich-machine-learning:3003
            - TRANSFORMATIONS_MAX_CONCURRENCY=${TRANSFORMATIONS_MAX_CONCURRENCY}
            - OCR_LANGUAGES=${OCR_LANGUAGES}
            - MAX_CACHE_SIZE=${MAX_CACHE_SIZE}
            - IMMICH_WORKER_THREADS=${IMMICH_WORKER_THREADS}
        healthcheck:
            disable: false
        image: ghcr.io/immich-app/immich-server:v3.0.3
        # 以指定 UID/GID 运行（宿主机挂载目录需 chown 到同一属主，否则容器内无法写入）
        user: "${UID}:${GID}"
        labels:
            createdBy: Apps
        networks:
            - 1panel-network
        ports:
            - "${HOST_IP}:${PANEL_APP_PORT_HTTP}:2283"
        restart: always
        volumes:
            - ${UPLOAD_PATH}:/usr/src/app/upload
            - /etc/localtime:/etc/localtime:ro
    immich-machine-learning:
        container_name: ${CONTAINER_NAME}-ml
        environment:
            - TZ=${TZ}
            - MACHINE_LEARNING_WORKERS=${ML_WORKERS}
            - MACHINE_LEARNING_MODEL_PRECISION=${ML_MODEL_PRECISION}
            # 模型空闲多少秒后自动卸载（上游默认 300；小显存卡可调小以尽快释放显存）
            - MACHINE_LEARNING_MODEL_TTL=${ML_MODEL_TTL}
        healthcheck:
            disable: false
        # 机器学习镜像：CPU 版 tag 与 immich-server 同版本号；NVIDIA CUDA 加速版
        # 在安装表单的「机器学习镜像 Tag」里填「同版本号 + -cuda」（该镜像仅发布 amd64 架构）
        image: ${ML_IMAGE}:${ML_IMAGE_TAG}
        labels:
            createdBy: Apps
        networks:
            - 1panel-network
        restart: always
        shm_size: 2gb
        volumes:
            - ${MODEL_CACHE_PATH}:/cache
        # ── NVIDIA GPU（可选，默认关闭）──────────────────────────────────────
        # 仅当上面的镜像 Tag 选成 `-cuda` 变体时才需要取消注释（CPU 版不需要 GPU）。
        # 启用方式：安装时勾选「编辑 Compose 文件」，把下面 8 行取消注释后保存。
        # deploy:
        #     resources:
        #         reservations:
        #             devices:
        #                 - driver: nvidia
        #                   count: 1
        #                   capabilities:
        #                     - gpu
