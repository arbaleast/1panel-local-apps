additionalProperties:
  key: immich
  name: immich
  tags:
  - Local
  shortDescZh: Immich 自托管照片视频管理
  shortDescEn: Immich self-hosted photo & video manager
  description:
    zh: Google Photos 替代品，ML 人脸识别，移动端原生体验。
    en: Google Photos 替代品，ML 人脸识别，移动端原生体验。
  type: media
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://immich.app/
  github: https://github.com/immich-app/immich
  document: https://docs.immich.app/
  formFields:
  - default: 2283
    edit: true
    envKey: PANEL_APP_PORT_HTTP
    labelEn: Web Port
    labelZh: Web 端口
    required: true
    rule: paramPort
    type: number
  - default: Asia/Shanghai
    edit: true
    envKey: TZ
    labelEn: Time Zone
    labelZh: 时区
    required: false
    type: text
  - default: /mnt/nfs/media/photos/immich/upload
    edit: true
    envKey: UPLOAD_PATH
    labelEn: Upload Storage (host path)
    labelZh: 上传文件存储路径（宿主机）
    required: true
    rule: paramPath
    type: text
  - default: ./data/model-cache
    edit: true
    envKey: MODEL_CACHE_PATH
    labelEn: Model Cache (host path)
    labelZh: 模型缓存目录（宿主机）
    required: true
    rule: paramPath
    type: text
  - default: 1Panel-postgresql-ZU4y
    edit: true
    envKey: DB_HOSTNAME
    labelEn: Postgres Host
    labelZh: 数据库服务名
    label:
      en: Postgres Host (1Panel container name)
      zh: 数据库服务名 (1Panel 容器名)
    required: true
    rule: paramCommon
    type: text
  - default: user_wEJsSp
    edit: true
    envKey: DB_USERNAME
    labelEn: Database User
    labelZh: 数据库用户名
    required: true
    rule: paramCommon
    type: text
  - default: password_tyrcEJ
    edit: true
    envKey: DB_PASSWORD
    labelEn: Database Password
    labelZh: 数据库密码
    required: true
    rule: paramCommon
    type: password
  - default: immich
    edit: true
    envKey: DB_NAME
    labelEn: Database Name
    labelZh: 数据库名称
    required: true
    rule: paramCommon
    type: text
  - default: 1Panel-redis-wd53
    edit: true
    envKey: REDIS_HOSTNAME
    labelEn: Redis Host
    labelZh: Redis 服务名
    label:
      en: Redis Host (1Panel container name)
      zh: Redis 服务名 (1Panel 容器名)
    required: true
    rule: paramCommon
    type: text
  - default: "1panel123"
    edit: true
    envKey: REDIS_PASSWORD
    labelEn: Redis Password
    labelZh: Redis 密码
    label:
      en: Redis Password
      zh: Redis 密码
    required: true
    rule: paramCommon
    type: text
  - default: "2"
    edit: true
    envKey: TRANSFORMATIONS_MAX_CONCURRENCY
    labelEn: Image Transform Thread Pool
    labelZh: 图片转换线程池
    required: false
    rule: paramCommon
    type: number
  - default: chi_sim+eng
    edit: true
    envKey: OCR_LANGUAGES
    labelEn: OCR Languages
    labelZh: OCR 语言
    required: false
    type: text
  - default: "512"
    edit: true
    envKey: MAX_CACHE_SIZE
    labelEn: Thumbnail Cache (MB)
    labelZh: 缩略图缓存上限（MB）
    required: false
    rule: paramCommon
    type: number
  - default: "2"
    edit: true
    envKey: IMMICH_WORKER_THREADS
    labelEn: Worker Threads
    labelZh: 并行任务线程数
    required: false
    rule: paramCommon
    type: number
  - default: "1"
    edit: true
    envKey: ML_WORKERS
    labelEn: ML Worker Processes
    labelZh: ML Worker 进程数
    required: false
    rule: paramCommon
    type: number
  - default: int8
    edit: true
    envKey: ML_MODEL_PRECISION
    labelEn: ML Model Precision
    labelZh: ML 模型精度
    required: false
    rule: paramSelect
    type: select
    values:
    - label: int8（省 CPU，推荐）
      value: int8
    - label: fp16（平衡）
      value: fp16
    - label: fp32（高精度）
      value: fp32

  # 机器学习镜像仓库（一般无需修改；与官方 ghcr.io/immich-app/immich-machine-learning 一致）
  - default: ghcr.io/immich-app/immich-machine-learning
    edit: true
    envKey: ML_IMAGE
    labelEn: ML Image Repository
    labelZh: 机器学习镜像仓库
    label:
      en: ML Image Repository
      zh: 机器学习镜像仓库
      zh-Hant: 機器學習映像倉庫
      ja: ML イメージリポジトリ
      ko: ML 이미지 저장소
      ru: Репозиторий образа ML
      ms: Repositori imej ML
      pt-br: Repositório da imagem ML
    required: true
    rule: paramImageTag
    type: text
  # 机器学习镜像 Tag：CPU 版与 immich-server 同版本号；NVIDIA CUDA 加速版在同版本号后加 -cuda（仅 amd64 架构）
  - default: v3.0.3
    edit: true
    envKey: ML_IMAGE_TAG
    labelEn: "ML Image Tag (CUDA: add -cuda)"
    labelZh: "机器学习镜像 Tag（CUDA 加 -cuda）"
    label:
      en: "ML Image Tag (CUDA: add -cuda)"
      zh: "机器学习镜像 Tag（CUDA 加 -cuda）"
      zh-Hant: "機器學習映像 Tag（CUDA 加 -cuda）"
      ja: "ML イメージ Tag（CUDA: -cuda を付与）"
      ko: "ML 이미지 Tag(CUDA: -cuda 추가)"
      ru: "Tag образа ML (CUDA: добавить -cuda)"
      ms: "Tag imej ML (CUDA: tambah -cuda)"
      pt-br: "Tag da imagem ML (CUDA: adicione -cuda)"
    required: true
    rule: paramImageTag
    type: text
  # 模型空闲卸载时间（秒）：上游默认 300；小显存卡（如 2GB）可调小以尽快释放显存
  - default: 300
    edit: true
    envKey: ML_MODEL_TTL
    labelEn: ML Model Idle TTL (seconds)
    labelZh: 模型空闲卸载时间（秒）
    label:
      en: ML Model Idle TTL (seconds)
      zh: 模型空闲卸载时间（秒）
      zh-Hant: 模型閒置卸載時間（秒）
      ja: モデルのアイドル TTL（秒）
      ko: 모델 유휴 TTL(초)
      ru: TTL простоя модели (секунды)
      ms: TTL model terbiaru (saat)
      pt-br: TTL de ociosidade do modelo (segundos)
    required: true
    rule: paramCommon
    type: number

  - default: 99
    edit: true
    envKey: UID
    labelEn: Run as UID
    labelZh: 运行用户 UID
    label:
      en: Run as UID
      zh: 运行用户 UID
      zh-Hant: 執行使用者 UID
      ja: 実行 UID
      ko: 실행 UID
      ru: UID пользователя
      ms: UID pengguna
      pt-br: UID do usuário
    required: true
    type: number
  - default: 100
    edit: true
    envKey: GID
    labelEn: Run as GID
    labelZh: 运行组 GID
    label:
      en: Run as GID
      zh: 运行组 GID
      zh-Hant: 執行群組 GID
      ja: 実行 GID
      ko: 실행 GID
      ru: GID группы пользователя
      ms: GID kumpulan pengguna
      pt-br: GID do grupo
    required: true
    type: number