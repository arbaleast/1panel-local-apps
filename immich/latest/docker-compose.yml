networks:
    1panel-network:
        external: true
services:
    immich-machine-learning:
        container_name: ${CONTAINER_NAME}-ml
        environment:
            - TZ=${TZ}
            - MACHINE_LEARNING_URL=http://immich-machine-learning:3003
            - MACHINE_LEARNING_WORKERS=${ML_WORKERS}
            - MACHINE_LEARNING_MODEL_PRECISION=${ML_MODEL_PRECISION}
        healthcheck:
            disable: false
        image: ghcr.io/immich-app/immich-machine-learning:${APP_VERSION}
        labels:
            createdBy: Apps
        networks:
            - 1panel-network
        restart: always
        shm_size: 2gb
        volumes:
            - ${MODEL_CACHE_PATH}:/cache
    immich-server:
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        environment:
            - TZ=${TZ}
            - DB_HOSTNAME=${DB_HOSTNAME}
            - DB_PORT=5432
            - DB_DATABASE_NAME=${DB_NAME}
            - DB_USERNAME=${DB_USERNAME}
            - DB_PASSWORD=${DB_PASSWORD}
            - REDIS_HOSTNAME=${REDIS_HOSTNAME}
            - REDIS_PORT=6379
            - REDIS_PASSWORD=${REDIS_PASSWORD}
            - TRANSFORMATIONS_MAX_CONCURRENCY=${TRANSFORMATIONS_MAX_CONCURRENCY}
            - OCR_LANGUAGES=${OCR_LANGUAGES}
            - MAX_CACHE_SIZE=${MAX_CACHE_SIZE}
            - IMMICH_WORKER_THREADS=${IMMICH_WORKER_THREADS}
        healthcheck:
            disable: false
        image: ghcr.io/immich-app/immich-server:${APP_VERSION}
        labels:
            createdBy: Apps
        networks:
            - 1panel-network
        ports:
            - "${HOST_IP}:${PANEL_APP_PORT_HTTP}:2283"
        restart: always
        volumes:
            - ${UPLOAD_PATH}:/usr/src/app/upload
            - /etc/localtime:/etc/localtime:ro
