networks:
    1panel-network:
        external: true
services:
    syncthing:
        container_name: ${CONTAINER_NAME}
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        environment:
            - PUID=99
            - PGID=100
            - TZ=${TIME_ZONE}
        hostname: syncthing
        image: linuxserver/syncthing:latest
        labels:
            createdBy: Apps
        networks:
            1panel-network:
                aliases:
                    - ${CONTAINER_NAME}
        ports:
            - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:8384
            - ${HOST_IP}:${SYNCTHING_PORT}:22000/tcp
            - ${HOST_IP}:${SYNCTHING_PORT}:22000/udp
            - ${HOST_IP}:${SYNCTHING_PORT_EXTRA_UDP}:21027/udp
        restart: always
        volumes:
            - ${DATA_PATH_APP_CONFIG}:/config
            - ${DATA_PATH_DATA1}:/data1
            - ${DATA_PATH_DATA2}:/data2
