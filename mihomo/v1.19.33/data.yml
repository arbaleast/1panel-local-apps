name: Mihomo
title: Mihomo (Clash Meta) 网络代理 — daitcl 镜像
description:
  zh: 基于 daitcl/mihomo 镜像（Mihomo 内核 + MetacubexD Dashboard + Caddy 静态托管）。支持 HTTP/SOCKS/混合代理、TUN 透明代理（默认开启）、通过订阅链接生成配置。
  en: 'Wraps daitcl/mihomo: Mihomo kernel + MetacubexD Dashboard served by Caddy. HTTP/SOCKS/mixed proxy, TUN mode (on by default), config generated from a subscription URL.'
  ja: 'daitcl/mihomo イメージベース: Mihomo カーネル + MetacubexD Dashboard（Caddy 配信）。HTTP/SOCKS 代理、TUN 透過プロキシ（デフォルト有効）、サブスク URL から設定を生成。'
  ko: 'daitcl/mihomo 이미지 기반: Mihomo 커널 + MetacubexD Dashboard(Caddy 제공). HTTP/SOCKS 프록시, TUN 투명 프록시(기본 활성), 구독 URL로 설정 생성.'
  ru: 'На базе daitcl/mihomo: ядро Mihomo + MetacubexD Dashboard (раздаётся через Caddy). HTTP/SOCKS прокси, TUN (включён по умолчанию), конфиг генерируется из ссылки подписки.'
  ms: 'Berdasarkan imej daitcl/mihomo: kernel Mihomo + Papan Pemuka MetacubexD (dihoskan Caddy). Proksi HTTP/SOCKS, mod TUN (aktif secara lalai), konfigurasi dijana daripada URL langganan.'
  pt-br: 'Baseado na imagem daitcl/mihomo: kernel Mihomo + Dashboard MetacubexD (servido pelo Caddy). Proxy HTTP/SOCKS/misto, modo TUN (ativo por padrão), config gerada a partir da URL de assinatura.'
  zh-Hant: 基於 daitcl/mihomo 映像（Mihomo 核心 + MetacubexD Dashboard + Caddy 靜態託管）。支援 HTTP/SOCKS/混合代理、TUN 透明代理（預設開啟）、透過訂閱連結產生設定。
