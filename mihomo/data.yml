additionalProperties:
  key: mihomo
  name: Mihomo
  title: Mihomo (Clash Meta) — 网络代理
  tags:
    - Network
    - Proxy
  description:
    zh: MetaCubeX 出品的 Clash Meta 内核，兼容 VMess/VLESS/Trojan/Shadowsocks 等协议，支持 HTTP/SOCKS 代理、规则分流、订阅管理。配套官方 Web UI 可视化管理。
    en: Clash Meta kernel by MetaCubeX. Supports VMess/VLESS/Trojan/Shadowsocks and more. HTTP/SOCKS proxy with rule-based routing and subscription management.
    ja: MetaCubeX の Clash Meta カーネル。VMess/VLESS/Trojan/Shadowsocks などをサポート。
    ko: MetaCubeX의 Clash Meta 커널. VMess/VLESS/Trojan/Shadowsocks 등 지원.
    ru: Ядро Clash Meta от MetaCubeX. Поддержка VMess/VLESS/Trojan/Shadowsocks.
    ms: Kernel Clash Meta oleh MetaCubeX. Menyokong VMess/VLESS/Trojan/Shadowsocks.
    pt-br: Kernel Clash Meta da MetaCubeX. Suporta VMess/VLESS/Trojan/Shadowsocks.
    es-es: Kernel Clash Meta de MetaCubeX. Compatible con VMess/VLESS/Trojan/Shadowsocks y más.
    tr: MetaCubeX'in Clash Meta çekirdeği. VMess/VLESS/Trojan/Shadowsocks ve daha fazlasını destekler.
    zh-Hant: MetaCubeX 出品的 Clash Meta 核心，支援 HTTP/SOCKS 代理、規則分流、訂閱管理。
  shortDescZh: Mihomo (Clash Meta) 网络代理
  shortDescEn: Mihomo (Clash Meta) network proxy
  type: tool
  architectures:
    - amd64
    - arm64
  crossVersionUpdate: true
  limit: 0
  recommend: 0
  website: https://wiki.metacubex.one/
  github: https://github.com/MetaCubeX/mihomo
  document: https://wiki.metacubex.one/en/
  formFields:
    - default: gangz1o/glash:latest
      edit: true
      envKey: IMAGE
      labelEn: Image
      labelZh: 镜像
      label:
