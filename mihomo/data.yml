        zh: 镜像
        ja: イメージ
        ko: 이미지
        ru: Образ
        ms: Imej
        pt-br: Imagem
        es-es: Imagen
        tr: İmaj
        zh-Hant: 映像
      required: true
      rule: paramImageTag
      type: text
    - default: 7890
      edit: true
      envKey: PANEL_APP_PORT_HTTP
      labelEn: HTTP Proxy Port
      labelZh: HTTP 代理端口
      label:
        en: HTTP Proxy Port
        zh: HTTP 代理端口
        ja: HTTP プロキシポート
        ko: HTTP 프록시 포트
        ru: Порт HTTP-прокси
        ms: Port Proksi HTTP
