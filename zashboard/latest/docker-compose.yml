networks:
  1panel-network:
    external: true
services:
  zashboard:
    container_name: ${CONTAINER_NAME}
    # 以指定 UID/GID 运行（宿主机挂载目录需 chown 到同一属主，否则容器内无法写入）
    user: "${UID}:${GID}"
    image: ghcr.io/kashinoleg/zashboard:latest
    labels:
      createdBy: Apps
    networks:
      1panel-network:
        aliases:
        - ${CONTAINER_NAME}
    ports:
    - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:80
    restart: always
    volumes:
    - ${DATA_PATH}:/app/data
