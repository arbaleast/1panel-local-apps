networks:
  1panel-network:
    external: true
services:
  searxng:
    container_name: ${CONTAINER_NAME}
    deploy:
      resources:
        limits:
          cpus: ${CPUS}
          memory: ${MEMORY_LIMIT}
    environment:
    - BASE_URL=${SEARXNG_EXTERNAL_URL}
    image: searxng/searxng:2026.8.14-094c33d40
    labels:
      createdBy: Apps
    networks:
      1panel-network:
        aliases:
        - ${CONTAINER_NAME}
    ports:
    - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:8080
    restart: always
    volumes:
    - ${DATA_PATH}:/etc/searxng
# 注：Redis 缓存为可选增强。若需启用，请在 1Panel 部署时将 `SEARXNG_REDIS_URL`
# 作为「额外环境变量」手动添加，值形如 `redis://:password@host:6379/0`。
# 留空则使用 SearXNG 默认的 filecache，无需任何额外配置。
# 1Panel 的 formFields 中已提供 `REDIS_URL` 字段供复制使用。
