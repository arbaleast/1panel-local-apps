networks:
    1panel-network:
        external: true
services:
    searxng:
        container_name: ${CONTAINER_NAME}
        deploy:
            resources:
                limits:
                    cpus: ${CPUS}
                    memory: ${MEMORY_LIMIT}
        environment:
            - BASE_URL=${SEARXNG_EXTERNAL_URL}
        image: searxng/searxng:latest
        labels:
            createdBy: Apps
        networks:
            - 1panel-network
        ports:
            - ${HOST_IP}:${PANEL_APP_PORT_HTTP}:8080
        restart: always
        volumes:
            - ${DATA_PATH}:/etc/searxng
