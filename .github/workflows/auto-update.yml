name: auto-update

# ─── 事件隔离（2026-11 安全加固）────────────────────────────────────────────
# 本工作流有两类完全不同的任务，必须物理隔离：
#   1. validate     —— **只读校验**。PR 事件唯一允许执行的任务。
#                      只跑 npm test / npm run lint / npm run docs:check，不写仓库、不发请求、不碰 Token。
#                      分级拦截：lint 有 error（P0/P1）→ exit 1 阻塞合并；
#                      warning（P2）→ ::warning:: 标注，仅提示不阻塞。
#   2. auto-update  —— **写操作**（检测 / 改 README / 推分支 / 开 PR / 合并 PR）。
#                      只允许在 schedule / workflow_dispatch / push(受控路径) 上运行，
#                      PR 事件一律跳过（if: github.event_name != 'pull_request'）。
#
# 为什么必须这样切：旧版工作流把 lint job 和 detect-and-pr job 串在一起，
# 且 workflow 顶层直接写 `permissions: contents: write / pull-requests: write`，
# 再叠加 `pull_request` 触发 —— 意味着**任何外部 PR 的代码都能在持有写权限的
# job 里执行**（checkout 用的是 secrets.PAT_TOKEN），属于典型的 CI 提权漏洞。
on:
  schedule:
    # 每周一 UTC 0 点（北京时间 08:00）
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      apps:
        description: '指定要检测的应用（逗号分隔），留空则检测全部'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    # push 到 main 的触发条件**只限自动更新链路自身的文件**：
    # 改动应用配置的 push（如 auto-update PR 合并）不会重新触发检测，
    # 从根上避免"合并 → 再检测 → 再开 PR"的递归。
    paths:
      - '.github/workflows/auto-update.yml'
      - '.github/scripts/**'
      - '.github/lib/**'
      - '.github/bin/**'
      - '.github/app-aliases.yml'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    # PR 事件只用于跑只读校验（validate job）。
    #
    # ⚠️ 这里**故意不加 paths 过滤**（2026-11 可靠性治理）：
    #   路径过滤 + Required Status Checks 的组合会造成「必需检查从未被触发」——
    #   GitHub 会把「从未出现的必需检查」视为**未通过**，导致 PR 永久卡死。
    #   自动更新 PR 只改 README / data.yml 等应用文件，若按 paths 过滤，
    #   validate job 可能根本不跑 → open-update-pr.mjs 的必需检查门禁永远超时。
    #   本仓应用规模小（60 个应用），全量校验成本可接受。
    types: [opened, synchronize, reopened]

# 顶层不授予任何权限：每个 job 按需显式申请（最小权限原则）。
# 未列出的 scope（如 actions、id-token、packages）一律为 none。
permissions: {}

# 并发控制：
#   - PR 事件按 ref 分组，新 run 取消旧 run（同一 PR 的重复 push 不需要排队）
#   - 其余事件（schedule / workflow_dispatch / push）统一进 'batch' 组，
#     **串行执行且不取消**，避免同一天开出两个批次 PR / 两批推送互相覆盖。
concurrency:
  group: auto-update-${{ github.event_name == 'pull_request' && github.ref || 'batch' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ─── 只读校验（PR 事件唯一允许执行的任务）─────────────────────────────
  validate:
    name: 只读校验（单测 + 跨文件一致性 lint）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # 只读：不写仓库、不发 PR
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 不把 GITHUB_TOKEN 写进 .git/config：
          # PR 代码会在后续步骤里被执行（npm ci / npm test），
          # 凭据不落盘可避免被 PR 侧代码读走。
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          # 版本约束与本地开发共用 .nvmrc（与 package.json engines 对齐）
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      # lib/ 单元测试
      - name: npm test
        run: npm test

      # data.yml schema + 跨文件一致性校验（SSOT）
      # 有 error（P0/P1）时 exit 1 直接阻塞 PR 合并
      - name: npm run lint
        run: npm run lint

      # P2 警告标注（非阻塞）：把 lint warnings 转成 GitHub annotations 提示，
      # 不影响 job 结论；errors 已由上一步的 exit 1 阻塞，这里用 always()
      # 保证「errors + warnings 并存」时 warnings 也能被标注出来。
      # GitHub 每个 step 同类型 annotation 上限 10 条，超出部分汇总一条提示。
      - name: P2 警告标注（非阻塞）
        if: always()
        run: |
          LINT_FAILED=0
          npm run lint --silent -- --json > /tmp/lint-pr.json || LINT_FAILED=1
          node -e "
            const r = require('/tmp/lint-pr.json');
            const w = (r.findings && r.findings.warnings) || [];
            for (const f of w.slice(0, 10)) {
              console.log('::warning file=' + f.file + (f.line ? ',line=' + f.line : '') + ',title=' + f.ruleId + '::' + f.message);
            }
            if (w.length > 10) {
              console.log('::warning title=lint P2 warnings::另有 ' + (w.length - 10) + ' 条警告未逐一标注（每 step 10 条上限），完整清单见 lint 日志');
            }
            console.log('P2 warnings: ' + w.length + '（非阻塞，豁免 ' + (r.waived || 0) + ' 条）');
          "
          # lint 本身失败（存在 error）时仍然让 step 红，warnings 标注只是附加信息
          exit $LINT_FAILED

      # 文档质量校验（AGENTS.md 路由 / docs 交叉引用 / 代码栅栏）
      # docs:check 是只读检查，不写仓库、不发请求，可安全在 PR 事件上运行
      - name: npm run docs:check
        run: npm run docs:check

      # ─── Level 1 + Level 2：部署兼容性核验（架构 / GPU / 权限 / 依赖就绪）──
      # 与上面的 `npm run lint` 同属 Level 1 阻塞门禁，但**开启 manifest 模式**：
      #   · Level 1（阻塞，exit 1 阻止 PR 合并）：
      #       compose 模拟渲染、必填变量闭环、端口/卷配置合法性、SSOT 一致性、
      #       **镜像 manifest 与 data.yml 架构声明的对齐**（阶段 3）
      #   · Level 2（不阻塞）：特权容器 / host 网络 / docker socket / 未说明的 GPU 配置
      #       → ::warning:: 注解 + Step Summary
      #   · UNVERIFIED（不阻塞）：因网络受限/限流/私有源查不到的 manifest
      #       → ::notice:: 注解 + Step Summary，**明确标注「未验证」而不是「通过」**
      #
      # manifest 结果落 cache，避免每次 PR 都全量打 registry（防限流）。
      - name: 缓存 manifest 元数据
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/manifest-cache.json
          key: manifest-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            manifest-${{ runner.os }}-

      - name: 部署兼容性核验（Level 1 阻塞 + Level 2 警告 + UNVERIFIED 标注）
        if: always()
        env:
          MANIFEST_CACHE_FILE: ${{ runner.temp }}/manifest-cache.json
        run: |
          LINT_FAILED=0
          npm run lint:deploy --silent -- --json > /tmp/deploy-compat.json || LINT_FAILED=1
          node .github/bin/render-deploy-compat-report.mjs /tmp/deploy-compat.json || LINT_FAILED=1
          exit $LINT_FAILED

  # ─── Level 3：隔离沙箱冒烟测试（条件测试，**不阻塞** PR 合并）─────────────
  # 真实拉起容器验证「装得上、起得来、挂载写得了、日志没崩」。
  # 三态显式呈现：PASSED / FAILED / UNVERIFIED（Skipped due to environment）。
  # 按目标 §十，Level 3 **不作为合并门禁**，只提示。
  smoke:
    name: 隔离沙箱冒烟测试（Level 3 条件测试）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [validate]
    # Level 3 失败**不阻塞**（continue-on-error 只影响本 job 的结论，不影响 validate）
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false
          # 需要 `git diff base...HEAD` 才能定位「本次变更涉及的应用」→ 必须完整历史
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: 冒烟测试（本次变更涉及的应用）
        env:
          # PR 事件用 base ref；其它事件退化为 origin/main
          SMOKE_BASE: ${{ github.event.pull_request.base.ref && format('origin/{0}', github.event.pull_request.base.ref) || 'origin/main' }}
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.ref || 'main' }}" || true
          node .github/bin/smoke-test.mjs --changed "$SMOKE_BASE"

  # ─── 自动更新（写操作，仅在受信任事件上运行）──────────────────────────
  auto-update:
    name: 检测镜像更新并开 PR
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: [validate]
    # 写操作只允许在明确授权的事件上运行（PR 事件一律排除）：
    #   · schedule —— 默认分支
    #   · workflow_dispatch / push —— 仅限 main 分支（防止从任意分支以 PAT 写权限运行）
    if: >-
      github.event_name == 'schedule'
      || ((github.event_name == 'workflow_dispatch' || github.event_name == 'push')
          && github.ref == 'refs/heads/main')
    permissions:
      contents: write        # 推分支
      pull-requests: write   # 开 PR / 合并 PR
      checks: read           # 读目标 PR 的 Check Runs（合并门禁必需）
      statuses: read         # 读目标 PR 的合并 commit status（合并门禁必需）
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 公共仓库 GITHUB_TOKEN 无权创建 PR，需配置 PAT_TOKEN；
          # 两者都拿不到时下面的步骤会显式失败（不会静默降级）。
          token: ${{ secrets.PAT_TOKEN || github.token }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm ci

      - name: 检测更新
        id: detect
        env:
          APPS_FILTER: ${{ inputs.apps || github.event.inputs.apps || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # 显式传入事件名：脚本层据此拒绝 PR 事件的写操作（防御纵深）
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        # continue-on-error 只用于"让健康应用的批次仍能开 PR"，
        # 失败**不会**被吞掉：steps.detect.outcome 仍为 failure，
        # 末尾的「检测失败门禁」步骤会显式 exit 1 让整个 workflow 变红。
        continue-on-error: true
        run: node .github/scripts/detect-updates.mjs

      - name: 输出检测结果
        if: always()
        run: |
          if [[ -f updates.json ]]; then
            # 只输出「**有更新**的应用」的 app/from/to/services 摘要表（行数 = 命中数，
            # 通常个位数）。逐应用全量明细由下方「输出执行结果」统一渲染一张表，
            # 这里**不再**重复渲染 60 行的每应用表（两表重复会让 Summary 变成噪音）。
            # 注意：也不直接 cat updates.json —— changes[].content 内嵌完整 data.yml，
            # 一次命中 30+ 应用会让 step summary 超过 GitHub 1 MiB 硬限制。
            node -e "
              const d = require('./updates.json');
              const s = d.scanned;
              const n = d.updates.length;
              let md = '\n扫描: ' + s + ' 个应用\n命中: ' + n + ' 个更新\n\n| App | From | To | Services |\n|---|---|---|---|\n';
              d.updates.forEach(u => {
                const svc = u.services.map(x => x.name).join(', ');
                md += '| ' + u.app + ' | ' + (u.from || '(new)') + ' | ' + u.to + ' | ' + svc + ' |\n';
              });
              process.stdout.write(md);
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "无 updates.json 生成" >> $GITHUB_STEP_SUMMARY
          fi

      # 端到端执行结果（检测 → 目录生成 → SSOT 校验 → PR → CI → 合并）
      # 由 bin/open-update-pr.mjs 写出 execution.json；本步骤负责渲染到 Summary。
      # always()：即使开 PR / 合并失败，Summary 也要给出「失败在哪一步、为什么」。
      - name: 输出执行结果（PR / CI / 合并阶段）
        if: always()
        run: |
          if [[ -f execution.json ]] || [[ -f updates.json ]]; then
            node -e "
              const fs = require('fs');
              const read = (p) => { try { return JSON.parse(fs.readFileSync(p, 'utf8')); } catch { return {}; } };
              const exec = read('execution.json');
              const updates = read('updates.json');
              import('./.github/lib/report.mjs').then(m => {
                process.stdout.write(m.renderExecutionMarkdown(exec, { title: '自动更新执行结果', results: updates.results || [], appTable: false }));
              });
            " >> $GITHUB_STEP_SUMMARY
          else
            echo "无 updates.json / execution.json 生成" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 检查是否有更新
        id: check
        # always()：即使部分应用检测失败，也要让健康应用的批次走完开 PR 流程，
        # 最终由末尾的「检测失败门禁」把整个 workflow 标红（不吞错误，也不放弃整批）。
        if: always()
        run: |
          if [[ -f updates.json ]] && [[ $(node -e "const d=require('./updates.json');console.log(d.updates.length>0?'y':'n')") == "y" ]]; then
            echo "has-updates=true" >> $GITHUB_OUTPUT
          else
            echo "has-updates=false" >> $GITHUB_OUTPUT
          fi

      - name: 同步 README.md
        if: steps.check.outputs.has-updates == 'true'
        run: node .github/scripts/sync-readme.mjs

      # 生成批次后必须重新校验一遍仓库：
      # validate job 校验的是**变更前**的代码，这里校验的是 detect 生成的
      # 新版本目录 / data.yml / compose（lint + 批次校验）。
      - name: 校验生成的配置（data.yml schema + 批次一致性）
        if: steps.check.outputs.has-updates == 'true'
        run: |
          npm run lint
          node .github/bin/validate-update-batch.mjs

      # 开 PR + 等待必需检查通过后再合并（检查未通过 / 状态未知一律不合并）
      - name: 开 PR 并在检查通过后合并
        if: steps.check.outputs.has-updates == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # 只传**真 PAT**，不再回退 github.token：
          # GITHUB_TOKEN 创建的 PR 不会触发 pull_request 工作流 → 目标 PR 的
          # 必需检查永远不会出现 → 合并门禁必然卡满超时，批次静默丢失。
          # 缺 PAT 时让 open-update-pr.mjs **立即失败并给出可执行指引**，
          # 而不是退化成「跑满 15 分钟才报错」。
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
          # 等待必需检查的窗口：15 分钟 / 20 秒轮询一次。
          # 超时或状态未知 → 保留 PR 与远程分支，不合并（脚本内默认 30 分钟，这里收紧）。
          MERGE_TIMEOUT_MS: '900000'
          CHECK_POLL_INTERVAL_MS: '20000'
          # 目标 PR 上**必须**通过的检查（缺任一 → 绝不合并）。
          # 必须与上面 validate job 的 `name:` 完全一致（workflow.test.mjs 会锁定两者一致）。
          REQUIRED_CHECKS: 只读校验（单测 + 跨文件一致性 lint）
        run: node .github/bin/open-update-pr.mjs

      # ─── 门禁：任一应用检测失败 → 整个 workflow 明确失败 ──────────────────
      # 放在最后：既让健康应用的批次能正常开 PR，又保证 workflow 不会绿灯。
      - name: 检测失败门禁
        if: always() && steps.detect.outcome == 'failure'
        run: |
          echo "::error::检测阶段存在失败的应用（明细见 updates.json 与上方的检测结果表）"
          exit 1
