name: auto-update

on:
  schedule:
    # 每周一 UTC 0 点
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      apps:
        description: '指定要检测的应用（逗号分隔），留空则检测全部'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-update.yml'
      - '.github/scripts/detect-updates.mjs'
      - '.github/scripts/sync-readme.mjs'
      - '.github/app-aliases.yml'

# 取消并发运行：避免同一天多 PR 冲突
concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-and-pr:
    name: 检测镜像更新并开 PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 公共仓库 GITHUB_TOKEN 无权创建 PR，需配置 PAT_TOKEN
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install js-yaml
        run: npm ci --omit=dev --silent

      - name: 检测更新
        id: detect
        env:
          APPS_FILTER: ${{ inputs.apps || github.event.inputs.apps || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/detect-updates.mjs

      - name: 输出检测结果
        if: always()
        run: |
          echo "## 检测结果" >> $GITHUB_STEP_SUMMARY
          if [[ -f updates.json ]]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat updates.json >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "无 updates.json 生成" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 检查是否有更新
        id: check
        run: |
          if [[ -f updates.json ]] && [[ $(node -e "const d=require('./updates.json');console.log(d.updates.length>0?'y':'n')") == "y" ]]; then
            echo "has-updates=true" >> $GITHUB_OUTPUT
          else
            echo "has-updates=false" >> $GITHUB_OUTPUT
          fi

      - name: 同步 README.md
        if: steps.check.outputs.has-updates == 'true'
        run: node .github/scripts/sync-readme.mjs

      - name: 收集变更并开 PR
        if: steps.check.outputs.has-updates == 'true'
        uses: actions/github-script@v8
        with:
          # 公共仓库 GITHUB_TOKEN 无权创建 PR，需配置 PAT_TOKEN
          github-token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');

            // 配置 git 用户信息
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');

            const today = new Date().toISOString().slice(0, 10);
            const branch = `auto-update/${today}`;

            // 1. 去重：同日是否已有 open PR
            const existing = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${context.repo.owner}:${branch}`,
            });
            if (existing.data.length > 0) {
              core.info(`⏭️ 今日 (${today}) 已存在 PR，跳过`);
              return;
            }

            // 2. 创建本地分支（基于当前 HEAD，即 main 最新提交）
            execSync(`git checkout -b ${branch}`, { stdio: 'inherit' });

            // 3. 暂存所有改动
            execSync('git add -A');
            const status = execSync('git status --porcelain').toString();
            if (!status.trim()) {
              core.info('无文件改动，跳过');
              return;
            }

            // 4. 提交
            execSync(
              `git commit -m "chore(deps): auto-update ${today}\n\n[skip ci]" ` +
              `-m "本批次自动检测到的更新（含 README 同步）。\\n\\n🤖 Generated by .github/workflows/auto-update.yml"`,
              { stdio: 'inherit' }
            );

            // 5. 推送分支到远程（force: 每日分支可安全覆盖）
            execSync(`git push --force origin ${branch}`, { stdio: 'inherit' });

            // 6. 生成 PR body
            const updates = JSON.parse(fs.readFileSync('updates.json', 'utf8')).updates;
            let body = `## 自动检测到的新版本\n\n检测时间：\`${new Date().toISOString()}\`\n\n`;
            for (const u of updates) {
              body += `### ${u.app}\n\n`;
              body += `| service | image | before | after |\n`;
              body += `|---------|-------|--------|-------|\n`;
              for (const svc of u.services) {
                body += `| ${svc.name} | ${svc.repo} | \`${svc.from}\` | \`${svc.to}\` |\n`;
              }
              body += `\n`;
            }
            body += `## 修改文件\n\n`;
            const changedFiles = execSync('git diff --name-only HEAD~1').toString().trim().split('\n');
            for (const f of changedFiles) {
              if (f) body += `- \`${f}\`\n`;
            }
            body += `\n---\n🤖 由 \`.github/workflows/auto-update.yml\` 自动生成，review 后 merge。\n`;

            // 7. 开 PR
            const { data: pr } = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `chore(deps): auto-update ${today} [skip ci]`,
              head: branch,
              base: 'main',
              body,
            });
            core.info(`✅ PR 已开: ${pr.html_url}`);
