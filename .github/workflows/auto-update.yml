name: auto-update

on:
  schedule:
    # 每周六 UTC 0 点（北京时间 08:00）
    - cron: '0 0 * * 6'
  workflow_dispatch:
    inputs:
      apps:
        description: '指定要检测的应用（逗号分隔），留空则检测全部'
        required: false
        default: ''
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/auto-update.yml'
      - '.github/scripts/detect-updates.mjs'
      - '.github/scripts/sync-readme.mjs'
      - '.github/app-aliases.yml'
      - '.github/bin/open-update-pr.mjs'
  pull_request:
    paths:
      - '.github/lib/**'
      - '.github/bin/**'
      - '**/data.yml'

# 取消并发运行：避免同一天多 PR 冲突
concurrency:
  group: auto-update
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  lint:
    name: 代码质量与 data.yml 校验
    runs-on: ubuntu-latest
    # PR 上阻止合并；schedule / workflow_dispatch 时独立运行
    if: >
      github.event_name == 'pull_request'
      || github.event_name == 'push'
      || github.event_name == 'schedule'
      || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      # lib/ 单元测试
      - name: npm test
        run: npm test

      # data.yml schema 校验
      - name: npm run lint
        run: node .github/bin/lint-apps.mjs

  detect-and-pr:
    name: 检测镜像更新并开 PR
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # 公共仓库 GITHUB_TOKEN 无权创建 PR，需配置 PAT_TOKEN
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install js-yaml
        run: npm ci --omit=dev --silent

      - name: 检测更新
        id: detect
        env:
          APPS_FILTER: ${{ inputs.apps || github.event.inputs.apps || '' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/detect-updates.mjs

      - name: 输出检测结果
        if: always()
        run: |
          echo "## 检测结果" >> $GITHUB_STEP_SUMMARY
          if [[ -f updates.json ]]; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            cat updates.json >> $GITHUB_STEP_SUMMARY
            echo '' >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "无 updates.json 生成" >> $GITHUB_STEP_SUMMARY
          fi

      - name: 检查是否有更新
        id: check
        run: |
          if [[ -f updates.json ]] && [[ $(node -e "const d=require('./updates.json');console.log(d.updates.length>0?'y':'n')") == "y" ]]; then
            echo "has-updates=true" >> $GITHUB_OUTPUT
          else
            echo "has-updates=false" >> $GITHUB_OUTPUT
          fi

      - name: 同步 README.md
        if: steps.check.outputs.has-updates == 'true'
        run: node .github/scripts/sync-readme.mjs

      - name: 开 PR 并合并
        if: steps.check.outputs.has-updates == 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: node .github/bin/open-update-pr.mjs
