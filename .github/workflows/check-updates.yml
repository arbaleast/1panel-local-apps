name: Check Image Updates

on:
  schedule:
    - cron: '0 9 * * 1'  # 每周一 9:00 UTC
  workflow_dispatch:       # 手动触发

jobs:
  check-updates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Docker image updates
        run: |
          chmod +x scripts/check-updates.sh
          ./scripts/check-updates.sh 2>&1 | tee /tmp/check-result.txt
          
      - name: Create issue if updates found
        if: contains(env.RESULT, '⚠')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const result = fs.readFileSync('/tmp/check-result.txt', 'utf8');
            const updates = result.split('\n').filter(l => l.includes('⚠'));
            if (updates.length > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `📦 ${updates.length} 个应用有新版本可用`,
                body: '## 发现以下更新\n\n' + updates.map(u => `- ${u}`).join('\n') + 
                      '\n\n---\n*由 GitHub Actions 自动创建*',
                labels: ['updates']
              });
            }
        env:
          RESULT: ${{ env.RESULT }}
