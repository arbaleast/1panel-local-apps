  unmanic:
    dir: unmanic
    desc: 媒体库自动转码 (josh5 镜像, NVIDIA Pascal/P620 NVENC 加速)
  photopea:
    desc: 在线图像编辑器
  zashboard:
    desc: Mihomo 面板
  vane:
    desc: AI 问答引擎
  perplexica:  # 兼容旧名（已重命名为 Vane）
    dir: vane
    desc: AI 问答引擎（原 Perplexica）
