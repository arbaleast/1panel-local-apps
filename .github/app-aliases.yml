# 应用别名表 — 用于 sync-readme.mjs / detect-updates.mjs
# key = README 表格中的短名
# dir = 实际目录名（省略时同 key）；支持嵌套路径，如 dir: apps/photopea
# desc = 表格"说明"列（覆盖 data.yml shortDescZh）
# preferred_version = 强制指定版本（跳过自动检测）
# _missing = true 时 sync-readme 跳过此条目

aliases:
  handbrake:
    desc: 视频转码 (linuxserver, 单 GUI, P620 NVENC 已验证)
  handbrake-web:
    desc: 分布式 HandBrake 转码队列 (TheNickOfTime, ⚠️ heavy dev)
  jellyfin:
    dir: jellyfin
    desc: 媒体服务器
  kdenlive:
    dir: kdenlive
    desc: 视频剪辑器 (linuxserver Selkies GUI, 媒体目录挂载 + P620 NVENC 加速)
  kiwix-serve:
    desc: 离线维基百科与 ZIM 内容服务器
  immich:
    dir: immich
    desc: 照片管理
  moviepilot:
    dir: moviepilot
    desc: 影视自动化
  music-tag-web:
    desc: 音乐标签刮削与媒体库管理 Web 应用
  navi-homepage:
    desc: 轻量级个人导航站（前端可视化编辑 + 零依赖 Node 后端）
  newapi:
    dir: newapi
    desc: AI/LLM API 聚合网关
  onenav:
    desc: PHP + SQLite 3 开发的开源书签 / 导航管理器
  hindsight:
    dir: hindsight
    desc: AI 记忆系统
  # 以下条目 dir 与短名相同，省略 dir
  anirss:
    desc: 动漫 RSS
  bookorbit:
    desc: 自托管电子书 / 漫画 / 有声书 / PDF 库（KOReader / Kobo 双向同步 + 多用户 + OIDC/SSO）
  cfnb:
    desc: Cloudflare CDN 节点优选工具
  cfui:
    desc: cloudflared WebUI 管理面板
  cinny:
    desc: Matrix 聊天客户端
  collabora:
    desc: 自托管协作在线 Office 套件 (CODE, LibreOffice 内核)
  firecrawl:
    desc: 网页爬虫
  llamacpp:
    desc: 高性能本地 LLM 推理引擎
  llamaindex:
    desc: LLM 数据框架
  mediago:
    desc: 媒体嗅探与下载
  mihomo:
    desc: 代理工具
  marginalia:
    dir: marginalia
    desc: 本地优先的私人知识库 + LLM 研究代理
  grimmory:
    dir: grimmory
    desc: 自托管电子书 / 漫画 / 有声书库（多用户 + KOReader 同步 + BookDrop 入库）
  losslesscut:
    desc: 浏览器内视频/音频无损剪辑
  openreel-video:
    desc: 浏览器端开源视频剪辑工具
  openshot:
    desc: 开源视频剪辑与动画制作 (linuxserver Selkies GUI, 媒体目录挂载 + P620 NVENC 加速, 仅 amd64)
  optimisarr:
    desc: 媒体库自动转码 (FFmpeg 验证 + 回滚, Plex/Jellyfin/Emby, 仅 amd64)
  pgvector:
    desc: 向量数据库
  photoprism:
    desc: 自托管 AI 照片管理（人脸/场景识别 + 地图 + WebDAV）
  qdrant:
    desc: 向量搜索引擎
  searxng:
    desc: 隐私搜索引擎
  syncthing:
    desc: 文件同步
  traefik:
