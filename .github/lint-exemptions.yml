# 跨文件一致性校验豁免清单（单一事实来源）
#
# schema：app(必填) / ruleId(必填) / version(可选，缺省=该应用全部版本) / value(可选，须与 finding.actual 完全一致) / reason(必填)
# 约束：每条必须绑定到具体应用与检查项，禁止全局关闭；ruleId 必须是引擎已知项；
#       死条目（应用/版本目录消失、规则不再产生 finding）会被 lint 报 error 强制清理。
# 生成方式：由 stage6-waive.js 依据全量 lint 实测结果生成（72 组 / 220 findings 全覆盖），reason 均经文件实证。
#
exemptions:
