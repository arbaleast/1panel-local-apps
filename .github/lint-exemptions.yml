  - app: handbrake
    ruleId: runtime.high-privilege
    reason: "GPU 转码：NVIDIA_ENABLE=true 时经 runtime: nvidia 拉起 nvidia-container-cli（compose 注释注明），删除则 GPU 编码不可用"
  - app: handbrake-web
    ruleId: runtime.high-privilege
    reason: "GPU 转码：deploy.resources 预约 nvidia 设备（上游 setup guide 约定），删除则 GPU 编码不可用"
  - app: infinity
    ruleId: runtime.high-privilege
    reason: "GPU 向量检索：runtime: nvidia + deploy.devices 预约 GPU 设备，为该镜像的核心运行要求"
  - app: jellyfin
    ruleId: runtime.high-privilege
    reason: "硬件转码：devices 挂载 /dev/dri（VAAPI/QSV）与 runtime: nvidia（NVIDIA_VISIBLE_DEVICES=all）双通道，为媒体服务核心能力"
  - app: kdenlive
    ruleId: runtime.high-privilege
    reason: "GPU 渲染导出：上游镜像要求 runtime: nvidia，删除则硬件编码不可用"
  - app: llamacpp
    ruleId: runtime.high-privilege
    reason: "GPU 推理：上游镜像要求 runtime: nvidia，删除则回退 CPU 推理（性能不可用级）"
  - app: mihomo
    ruleId: runtime.high-privilege
    reason: "TUN 模式核心能力：NET_ADMIN + /dev/net/tun 设备挂载，缺失则 TUN 代理模式无法启用"
  - app: mineru
    ruleId: runtime.high-privilege
    reason: "GPU 推理：runtime 经 ${GPU_RUNTIME} 变量注入，默认空串回落普通 runtime（按需开启，非强制提权）"
  - app: openshot
    ruleId: runtime.high-privilege
    reason: "GPU 渲染导出：上游镜像要求 runtime: nvidia，删除则硬件编码不可用"
  - app: unmanic
    ruleId: runtime.high-privilege
    reason: "GPU 转码：上游镜像要求 runtime: nvidia，删除则硬件转码不可用"
  - app: xunlei
    ruleId: runtime.high-privilege
    reason: "SPK 启动器需在容器内做 bind mount 自挂载（SYS_ADMIN，compose 注释注明），属迅雷远程下载方案固有要求"
  - app: grimmory
    ruleId: runtime.identity-mixed
    reason: "jlesage 基座身份双通道约定：user: ${UID}:${GID} 由 UID/GID 注入，另保留 USER_ID/GROUP_ID env 供基座 s6 内部降权，属有意设计（见 compose 注释）"
  - app: losslesscut
    ruleId: runtime.identity-mixed
    reason: "jlesage 基座身份双通道约定：user: ${UID}:${GID} 由 UID/GID 注入，另保留 USER_ID/GROUP_ID env 供基座 s6 内部降权，属有意设计（见 compose 注释）"
  - app: linkwarden
    ruleId: tag.dir
    reason: "历史版本目录名（v1.53.1/v1.56.x）沿用旧命名体系，镜像 tag 已由 compose hardcode 为 v2.16.x（compose 为镜像权威）；重命名目录会破坏存量实例的 1Panel 升级参数"
  - app: traefik
    ruleId: volume.path
    reason: "traefik 为宿主机级反代：静态/动态配置与 ACME 证书位于宿主机固定路径（/home/al/workspace/traefik 与 .acme.sh），迁入仓库会引入证书等敏感文件；绝对路径挂载属部署特性"
